/**/fsc_autopilot_ros2:
  ros__parameters:

    # ══════════════════════════════════════════════════════════════════════
    # 0. NODE, RATES AND INTERFACES
    # ══════════════════════════════════════════════════════════════════════
    # "-4D" without "-HW": the sim mirror. vehicle_info info[0] shows it.
    vehicle_name: "AM-T650-ATC-PUSH"
    vehicle_num_rotors: 4
    system_posctl_type: robust_controller
    system_posctl_rate: 100.0
    system_attctl_rate: 250.0
    system_ude_type: velocity_based


    # ══════════════════════════════════════════════════════════════════════
    # 1. PLANT -- THE MIRROR
    # ══════════════════════════════════════════════════════════════════════
    # READ BY THE PEGASUS LAUNCHER (scripts/indoor_sim/lib/am_plant_from_yaml.sh),
    # NOT BY THIS NODE: rclcpp ignores undeclared keys, the launcher greps them
    # and hands them to the Isaac plant (06) on its command line. Precedence
    # environment > yaml > built-in default, per key. That is why the prefix
    # is sim_ and why the controller cannot see any of it -- the plant is the
    # experiment, the controller believes section 2.
    #
    # THE REFERENCE PLANT below is the MEAN over the six flights. The flights
    # differ mostly by battery state (kf tracks pack voltage), and a replay of
    # ONE flight should set that flight's kf and sag from table 1.6 through
    # PEGASUS_PLANT_KF_SCALE / PEGASUS_PLANT_KF_SAG_PER_MIN in the environment.
    #
    # ── 1.1 ROTORS (MN4010 + 15x5, t650_params.py is the base) ──────────────
    # THRUST. The sim plant's calibrated kf is 4.041283e-05 (the 2026-08-25
    # re-anchor on log_252, a low-voltage hover). The hover thrust balance of
    # the three campaigns -- kf_true = kf_believed * m g / u1 over every
    # planner HOLD, with kf_believed = the flown alloc_thrust_coeff
    # 4.260431e-05 -- gives kf at DIRECT entry of
    #   0918 4.31e-05 (24.1 V)  0921 4.26e-05 (23.8 V)  0924 F1 4.22e-05 (23.5 V)
    #   0924 F2 4.03e-05 (23.0 V)  F3 4.29e-05 (23.8 V)  F4 4.03e-05 (23.2 V)
    # mean 4.19e-05 = 1.037 x the sim plant. The same-command specific-thrust
    # test agrees flight by flight (DC gain 0.98-1.06).
    sim_plant_kf_scale: 1.037
    # BATTERY SAG. Over each DIRECT window kf falls linearly with the pack:
    # -3.4 (0918), -4.5 (F1), -4.0 (F2), -3.7 (F3), -2.6 (F4) %/min at ~20 A.
    # 06 applies kf(t) = kf0 (1 - r t/60) from lift-off. On 0918 this is what
    # walked d_hat_z from -0.1 to -1.0 N over the flight.
    sim_plant_kf_sag_per_min: 0.036
    # YAW. The sim plant's c is 3.0 x the bench 8.247e-07 (the 2026-08-06 PX4-
    # baseline yaw fit, standing in for the un-modelled rotor-inertia reaction
    # torque). In whole-body DIRECT the same-command yaw test reads the real
    # vehicle's yaw acceleration per command at 0.14-0.26 of THAT plant, i.e.
    # 0.43-0.78 of the BENCH c (0921 #3, the only flight with strong yaw
    # excitation: 0.78; the bare-T650 DIRECT campaign of 2026-08-07: 0.61).
    # Set to 0.70 x bench = 0.2333 x the plant constant. The allocator still
    # believes the bench ratio (km 0.018164), so the sim delivers ~70 % of
    # the commanded yaw torque, as the hardware does.
    sim_plant_km_scale: 0.2333
    # ROTOR LAG. Bench MN4010 value kept: the delay scan of the roll/pitch
    # response found <= 10 ms beyond it (0921 #3, corr 0.72/0.83).
    sim_plant_rotor_lambda: 10.0265
    # WALL-CLOCK COMPENSATION (2026-09-27). Every lag in this section is in
    # PLANT (physical) seconds, but the law and planner run on the WALL clock
    # and Isaac + PX4 run at RTF ~0.48 on shiqi-desktop: uncompensated, the law
    # sees the rotor pole at ~200 ms instead of 100 ms and the hardware gains
    # DIVERGE in DIRECT (2026-09-27 §7.17.1 launch: tilt watchdog 14 s after
    # entry; f18_r1 on 2026-09-26 the same). true = the Pegasus launcher divides
    # sim_plant_rotor_lambda and the current-noise corner by the machine's
    # SIM_RTF and multiplies sim_arm_vel_lag_s by it (PEGASUS_SIM_RTF overrides;
    # a value set in the environment is never rescaled). Keep it true; false
    # reproduces the divergence.
    sim_wall_clock_compensation: true

    # ── 1.2 AIRFRAME ─────────────────────────────────────────────────────────
    # MASS and INERTIA nominal. The node's mass gate holds vehicle_mass to the
    # model's 3.746174 kg (+-0.5 %), so a real mass error is indistinguishable
    # from a kf error at hover and is carried in kf above. Roll/pitch same-
    # command gains at the coupled inertia at home (0.112/0.132/0.116 kg.m^2):
    # 1.11 / 1.03 on 0921 #3 (corr 0.72/0.83) -- of which 1.06 is that
    # flight's kf -- so the inertia is right within the resolution here.
    sim_plant_mass_scale: 1.0
    sim_plant_inertia_scale: 1.0
    # BARE-AIRFRAME CoM. The hardware controller carries the measured
    # wb_base_com_y = -0.017854 (MODEL frame, 2026-08-25 flight); the USD
    # asset's own base CoM is at 0.3 mm. The plant must carry the same
    # offset so that belief and plant agree exactly as they did on hardware.
    # FRAME: these three are added to the USD body prim's centre of mass, i.e.
    # the ACTUAL x-forward body frame (model +y = actual +x), so the model's
    # -17.854 mm in y is -17.854 mm in x here. (The robustness file's comment
    # calling this the MODEL frame is wrong; its 10/10/5 mm never cared.)
    # The observer's roll/pitch residual at hover (0.03-0.05 N.m ~ 1 mm) says
    # the measured value is right; nothing is added for it.
    sim_plant_com_shift_x: -0.017854
    sim_plant_com_shift_y: 0.0
    sim_plant_com_shift_z: 0.0
    # STANDING WRENCH BIAS, body-fixed FLU [N] / [N.m], applied by 06 every
    # physics step. The filtered translational estimate d_hat_t sits at
    # (+0.57, -0.44) / (+0.57, -0.42) / (+0.47, -0.50) / (+0.62, -0.60) N on
    # 0918 / 0921 / 0924 F1 / F2 in every hover hold (world frame, all at
    # yaw ~0; on the 0924 circle its BODY-yaw-frame mean is constant to
    # 0.1 N while the heading sweeps 360 deg -> body-fixed), i.e. a real
    # ~0.7 N force the symmetric rotor model cannot make (a ~1.1 deg tilt
    # of the thrust axis against the mocap body frame). The rotational
    # estimate carries a -0.07..-0.13 N.m standing YAW torque on every flight
    # (prop/motor drag asymmetry). Both are what the observer must find in
    # the sim exactly as it did on hardware.
    sim_plant_force_bias_x: 0.55
    sim_plant_force_bias_y: -0.50
    sim_plant_force_bias_z: 0.0
    sim_plant_torque_bias_x: 0.0
    sim_plant_torque_bias_y: 0.0
    sim_plant_torque_bias_z: -0.095

    # ── 1.3 ARM ACTUATORS (OM-X, servo_model.py) ─────────────────────────────
    # CURRENT-LOOP RESIDUAL: the bench numbers (fsc_open_manipulator doc
    # "Current Loop Design.md" 9.6, 2026-09-11), unchanged -- the flights'
    # applied-minus-intended torque scatter (0.01-0.04 N.m rms) is consistent
    # with them. j1/j4 carry j3's value (their own sits below the current
    # sensor's floor).
    sim_arm_current_noise_enable: true
    sim_arm_current_noise_a_j1: 0.0096   # A rms total
    sim_arm_current_noise_a_j2: 0.0062
    sim_arm_current_noise_a_j3: 0.0096
    sim_arm_current_noise_a_j4: 0.0096
    sim_arm_current_noise_bw_hz: 5.0
    sim_arm_current_noise_seed: 0
    # GEARBOX FRICTION, PER JOINT, as a fraction of the calibration report's
    # model [fc + mu|tau|] tanh(qd/w) (servo_model.py FRICTION_*), which is
    # also what the arm controller feeds forward at 1.00 x on hardware and in
    # the sim arm stack (torque_controller_isaac_aerial.yaml). Identified in
    # flight on 0924 (wb_l1_4d_flight_20260924/analysis: friction_id.txt,
    # breakaway.txt), the two fast-arm flights F3/F4 being the informative
    # ones:
    #   j2  Coulomb-like 0.154 / 0.185 N.m and kinetic median 0.212 / 0.201
    #       against the model's 0.190 / 0.199 at that load     -> 0.95
    #   j3  0.068 / 0.091 and 0.089 / 0.097 against 0.112 / 0.114 -> 0.75
    #   j4  no in-flight motion; the 2026-09-13 ground test measured breakaway
    #       0.105-0.13 and kinetic ~0.07 N.m against the model's 0.052 -> 1.5
    #       (this is why the hardware config caps its observer share, 2.6)
    #   j1  no data                                              -> 1.0
    # The arm-side feed-forward stays at 1.00 x, so the mirror reproduces the
    # flights' "compensation 10-40 % high on j2/j3" as measured.
    sim_arm_friction_scale_j1: 1.0
    # 2026-09-26 audit (arm_comp_audit.txt): kinetic level on the MEASURED
    # velocity at the flown loads, all 0924 circles: j2 0.11-0.17 vs the report's
    # 0.20 (x0.70), j3 0.03-0.09 vs 0.11 (x0.65). Supersedes the 0.95/0.75 taken
    # from the earlier friction_id numbers. The arm stacks' feed-forward was
    # corrected by the same factors, so plant and compensation agree here as
    # on the corrected hardware.
    sim_arm_friction_scale_j2: 0.70
    sim_arm_friction_scale_j3: 0.65
    sim_arm_friction_scale_j4: 1.5
    sim_arm_friction_width: 0.015
    # ARM MASS nominal: at every hold the applied torque minus the model's
    # gravity term is within what friction holds (-0.04..-0.11 N.m on j2),
    # with no consistent sign across flights -- no gravity error resolvable.
    sim_arm_mass_scale: 1.0
    # JOINT-VELOCITY FEEDBACK. The law's qdot IS joint_states.velocity, which
    # on hardware is the Dynamixel Present Velocity: 0.024 rad/s quantum and a
    # 44-56 ms lag behind the encoder (cross-correlation of the reported
    # velocity against the differentiated reported position, j2/j3, all six
    # flights; corr up to 0.98). 06 applies a first-order lag of this time
    # constant plus the quantum to the velocity it REPORTS; the physics and
    # the friction model keep the true rate. This is the single largest
    # reason the sim arm used to track a sinusoid the hardware arm could not.
    sim_arm_vel_lag_s: 0.048
    sim_arm_vel_quant_rad_s: 0.024
    # The int16 Goal-PWM register (6-8 mN.m per count) is not modelled here:
    # below the current-loop residual. sim_arm_counts_enable would add it.

    # ── 1.4 END-EFFECTOR PAYLOAD ─────────────────────────────────────────────
    # No marker cube: the flights flew the bare gripper (the 0918+ mocap
    # rigid body on the gripper has no modelled mass).
    sim_ee_marker_cube: false
    sim_ee_marker_cube_mass_kg: 0.03

    # ── 1.5 FEEDBACK: the emulated mocap feed ────────────────────────────────
    # READ BY THE STACK SCRIPTS (not the node, not the Pegasus launcher) and
    # forwarded to isaacsim_optitrack_ros2_emulator, which publishes /uav_0/mocap
    # from Isaac's exact state. Before 2026-09-26 that feed was 250 Hz and
    # noise-free; the sim then hovered at 2.6 mm CoM rms / 1.2 deg tilt against
    # the flight's 27 mm / 3.8 deg (replay f18_r2). The real feed:
    #   0918   raw mocap 60 Hz, processor velocity: hover velocity noise
    #          2.6 / 2.2 / 1.5 cm/s (x/y/z), position wander 17 / 12 / 3 mm
    #          at 0.08-0.15 Hz
    #   0921   raw mocap 120 Hz: 10.8 / 5.0 / 4.2 cm/s (a finite difference)
    #   0924   EKF2-fused ~100 Hz: 1.2 / 1.5 / 0.9 cm/s
    # Modelled as white Gaussian noise per published sample on position and
    # linear velocity. In the raw stack the law reads these directly; in the
    # fused stack they are EKF2's external-vision input, as on hardware.
    # 2026-10-21: the experiments run the mocap at 120 Hz (user) -- 60 -> 120. The emulator
    # honours this value only since that day's launch-file fix: every earlier sim ran its
    # mocap at 250 Hz whatever this line said.
    sim_feedback_mocap_rate_hz: 120.0
    sim_feedback_pos_noise_m: 0.0005
    sim_feedback_vel_noise_mps: 0.022
    sim_feedback_noise_seed: 0

    # ── 1.6 PER-FLIGHT IDENTIFICATION (tools/fit_plant.py, analysis/) ───────
    # flight    kf at entry  kf_scale  sag %/min  V start->end  d_hat_t xy [N]  yaw bias
    # 0918      4.31e-05     1.066     3.4        24.11->23.60  +0.57 -0.44     -0.095
    # 0921 #3   4.26e-05     1.054     (21 s)     23.77->23.59  +0.57 -0.42     -0.072
    # 0924 F1   4.22e-05     1.043     4.5        23.54->23.07  +0.47 -0.50     -0.078
    # 0924 F2   4.03e-05     0.997     4.0        23.04->22.79  +0.62 -0.60     -0.131  (lift-off 4.17e-05 = x1.030: the SAFETY UDE's -3.0 N on the bench map; at 0.997 the sim cannot leave the ground -- bench map 4.1 N short below the 0.4 m UDE gate)
    # 0924 F3   4.29e-05     1.062     3.7        23.82->23.50   (no hold)       --
    # 0924 F4   4.03e-05     0.998     2.6        23.15->22.78   (no hold)       --

    # ══════════════════════════════════════════════════════════════════════
    # 2. CONTROLLER -- THE HARDWARE CONFIG VERBATIM
    # ══════════════════════════════════════════════════════════════════════
    # params_single_aerial_manipulator_whole_body_l1_4d_direct_actuation_t650.yaml
    # as of 2026-09-26 (the armature / K_y 80 / observer-velocity update of that
    # evening); the 0918-0924 flights and their replays used the AS-FLOWN values
    # noted beside each changed key. Comments are the hardware file's, shortened; the
    # values are not to be tuned here -- change the hardware file first.

    # ── 2.1 guards ───────────────────────────────────────────────────────────
    system_wd_max_tilt_deg: 15.0   # 2026-10-05 = the hardware file (was 20.0)
    system_wd_max_rate_dps: 360.0
    system_wd_max_drift_m: 0.75
    system_fb_timeout_s: 1.0
    system_fb_land_speed: 0.2
    # (system_arm_go_home_service: see section 3)

    # ── 2.2 vehicle + SAFETY thrust map ──────────────────────────────────────
    # The SAFETY tangent linearisation at the BENCH kf 4.540431e-05 and this
    # mass (u_hover 0.5792). On the mirror plant that map is ~7 % short of
    # hover, exactly as on hardware; the UDE absorbs it above its gate.
    vehicle_thrust_scaling: 0.036758
    vehicle_idle_thrust: 0.241528
    vehicle_mass: 3.746170

    # ── 2.3 SAFETY position loop (robust_controller) + UDE ──────────────────
    posctl_pid_form: "nested"
    posctl_apply_pos_err_saturation: true
    posctl_apply_vel_err_saturation: true
    posctl_k_pos_x: 0.45
    posctl_k_pos_y: 0.45
    posctl_k_pos_z: 1.0
    posctl_k_vel_x: 7.0
    posctl_k_vel_y: 7.0
    posctl_k_vel_z: 7.0
    ude_gain: 0.45
    ude_height_threshold: 0.4
    ude_disturbance_lbx: -10.0
    ude_disturbance_lby: -10.0
    ude_disturbance_lbz: -10.0
    ude_disturbance_ubx: 10.0
    ude_disturbance_uby: 10.0
    ude_disturbance_ubz: 10.0
    safety_min_thrust_setpoint: 0.0
    safety_max_thrust_setpoint: 150.0

    # ── 2.4 THE DIRECT LAW: ARBITRARY CONVERGENCE TIME (Chen et al., TIE 2025) ──
    # Four modules (arbitrary_time_control.py is the reference; where the paper
    # leaves a choice its header lists what is done):
    #  C. quadrotor (eqs 25-28): per channel r1 = chi_d - chi, r2 = chi_d' - chi',
    #     delta = -eta1 phi(r1)/t_go, eps = r2 - delta, N = eta1 [phi'(r1) r2/t_go
    #     + phi(r1)/t_go^2] + eta2 phi(eps)/t_go, tau_u = C chi' + G + M(chi_d'' +
    #     r1 + N) - J_E tau_hat + D_hat; the position rows' force through the
    #     decoupling module (eq 3) gives the thrust and the roll/pitch references.
    #  THE ONE STRUCTURAL ADDITION: t_go = max(t_e - t, floor). The paper's gain
    #  is unbounded at t_e and ZERO after it (an undamped unit oscillator); after
    #  the floor the law is a constant-gain backstepping, small-signal
    #  r1'' + (a+b) r1' + (1+ab) r1 = 0 with a = eta1/floor, b = eta2/floor.
    #  eta per channel [x y z roll pitch yaw] (the paper: one pair for all six).
    atc_quad_eta1_x: 1.04
    atc_quad_eta1_y: 1.04
    atc_quad_eta1_z: 1.5
    atc_quad_eta1_roll: 4.2
    atc_quad_eta1_pitch: 4.2
    atc_quad_eta1_yaw: 3.0
    atc_quad_eta2_x: 1.04
    atc_quad_eta2_y: 1.04
    atc_quad_eta2_z: 1.5
    atc_quad_eta2_roll: 4.2
    atc_quad_eta2_pitch: 4.2
    atc_quad_eta2_yaw: 3.0
    atc_quad_window_s: 1.2
    atc_quad_floor_s: 0.6
    atc_quad_ff_gain: 1.0
    # the UAM's inertia about the body origin, FLU (the coordinated-admittance
    # rig's numbers: the arm at home)
    atc_inertia_xx: 0.118
    atc_inertia_yy: 0.119
    atc_inertia_zz: 0.131
    atc_inertia_xy: 0.0089
    atc_inertia_xz: 0.0
    atc_inertia_yz: 0.0
    # safety shaping (not the paper's law): error saturations, the desired-force
    # tilt/floor clamps, per-axis torque clamps (yaw inside the allocator's budget)
    atc_max_pos_err_m: 1.0
    atc_max_vel_err_mps: 2.0
    atc_max_att_err_rad: 0.6
    atc_max_tilt_deg: 30.0
    atc_min_thrust_frac: 0.3
    atc_max_torque_xy: 8.0
    atc_max_torque_z: 0.55
    #  B. TSKFE (eqs 19-24, 29): x1 = max|chi_d - chi|, x2 = max|chi_d' - chi'|;
    #     the paper's 5 x 5 triangles; k-FRI (k = 3) spawns a rule for an input
    #     that fires none; omega_e' = c_e (M^-T eps)_e X phi^T. c: the paper's
    #     position values, the attitude ones scaled to this inertia.
    atc_fuzzy_enable: true
    atc_fuzzy_c_x: 20.9
    atc_fuzzy_c_y: 31.1
    atc_fuzzy_c_z: 33.3
    atc_fuzzy_c_roll: 0.1
    atc_fuzzy_c_pitch: 0.1
    atc_fuzzy_c_yaw: 0.1
    atc_fuzzy_k_closest: 3.0
    atc_fuzzy_l_max: 0.0
    atc_fuzzy_max_rules: 400.0
    atc_fuzzy_a_max_force: 10.0
    atc_fuzzy_a_max_torque: 1.0
    atc_fuzzy_out_max_force: 10.0
    atc_fuzzy_out_max_torque: 1.0
    #  A. ACTNDO (eqs 6-11): stage 1 (generalized momentum, Gamma1, eta_o1) and
    #     stage 2 (tau_hat = rho + k H, Gamma2, eta_o2) on the arm's fixed-base
    #     dynamics; windows restart at DIRECT entry and every interaction edge
    #     (the planner's contact flag). The proof-consistent sign of w_o2.
    atc_obs_enable: true
    atc_obs_k: 4.0
    atc_obs_eta1: 5.0
    atc_obs_eta2: 5.0
    atc_obs_gamma1: 25.0
    atc_obs_gamma2: 25.0
    atc_obs_window1_s: 0.4
    atc_obs_window2_s: 0.4
    atc_obs_floor_s: 0.25
    atc_obs_est_max: 3.0
    #  D. the arm (eqs 34-38): admittance H_d/D_d/K_d (the paper's experiment
    #     1/4/9) on tau_hat makes q_c; the backstepping law tracks it with the
    #     computed-torque model, minus tau_hat. q_c is kept in the joint box.
    atc_adm_h_j1: 0.3333
    atc_adm_h_j2: 0.3333
    atc_adm_h_j3: 0.3333
    atc_adm_h_j4: 0.3333
    atc_adm_d_j1: 1.34
    atc_adm_d_j2: 1.34
    atc_adm_d_j3: 1.34
    atc_adm_d_j4: 1.34
    atc_adm_k_j1: 3.0
    atc_adm_k_j2: 3.0
    atc_adm_k_j3: 3.0
    atc_adm_k_j4: 3.0
    atc_adm_e_max: 0.35
    atc_arm_eta1_j1: 5.3
    atc_arm_eta1_j2: 5.3
    atc_arm_eta1_j3: 5.3
    atc_arm_eta1_j4: 5.3
    atc_arm_eta2_j1: 4.8
    atc_arm_eta2_j2: 4.8
    atc_arm_eta2_j3: 4.8
    atc_arm_eta2_j4: 4.8
    atc_arm_window_s: 2.0
    atc_arm_floor_s: 1.0
    atc_arm_q_min_deg_j1: -33.0
    atc_arm_q_min_deg_j2: -18.0
    atc_arm_q_min_deg_j3: 5.0
    atc_arm_q_min_deg_j4: -118.0
    atc_arm_q_max_deg_j1: 33.0
    atc_arm_q_max_deg_j2: 43.0
    atc_arm_q_max_deg_j3: 48.0
    atc_arm_q_max_deg_j4: 118.0
    atc_tau_max: 3.0
    # the arm model (= the planner's: base_com and the joint-diagonal armature
    # copied from section 4 by the generator), the windows, the J_m^-T damping
    atc_base_com_x: 0.0
    atc_base_com_y: -0.017854
    atc_base_com_z: 0.0
    atc_armature_j1: 0.01
    atc_armature_j2: 0.0194
    atc_armature_j3: 0.0097
    atc_armature_j4: 0.0097
    atc_controller_window_on_contact: false
    atc_ie_lambda: 0.05
    atc_contact_reseat: true
    atc_contact_reseat_blend_s: 1.0
    # ── 2.5 THE INTERFACE: the arm stack and the planner's stream ──────────
    # The ONE arm reference (arm_planner in SAFETY, the trajectory planner in
    # DIRECT); joint TORQUES out; the task as WholeBodyReference (MODEL frame),
    # converted to the base trajectory x_b = x_cd - R0 r_0c(q_d) and the joint
    # trajectory q_d. SAFETY streams the PD + model-gravity arm hold (the Isaac
    # arm stack has no gravity model). DIRECT entry is gated on a settled hover.
    atc_arm_joint_topic: "fsc_open_manipulator/joint_states"
    atc_arm_velocity_topic: "fsc_open_manipulator/external_torque_controller/velocity_observer"
    atc_arm_velocity_timeout_s: 0.05
    atc_arm_reference_topic: "fsc_open_manipulator/external_torque_controller/reference_joint_trajectory"
    atc_arm_torque_topic: "fsc_open_manipulator/external_torque_controller/joint_torque_command"
    atc_streamed_ref_topic: "fsc_autopilot_ros2/arbitrary_time_direct_actuation/reference"
    atc_streamed_ref_timeout_s: 0.25
    atc_arm_state_timeout_s: 0.5
    atc_arm_reference_timeout_s: 0.2
    atc_arm_hold_kp: 3.0
    atc_arm_hold_kd: 0.25
    atc_arm_hold_stream: true
    atc_gate_pos_m: 0.15
    atc_gate_vel_mps: 0.2
    atc_gate_arm_rad: 0.05

    # ── 2.8 wrench allocation -- AM_xfwd geometry, MN4010 motors ────────────
    # THE BELIEVED kf AND km ARE THE FLOWN ONES: 4.260431e-05 (the 2026-09-12
    # experiment value, bench 4.540431e-05 understated 6.2 %) and the bench km
    # +-0.018164. Against the mirror plant's kf (1.1: 4.19e-05 mean) the
    # allocator over-believes thrust by ~1.7 % on average -- the real mismatch
    # the observer absorbed on those days (d_hat_z +0.4 .. -2.2 N), not the
    # robustness file's +17.6 %.
    alloc_rotor0_px: 0.22990663
    alloc_rotor0_py: 0.22990663
    alloc_rotor0_km: 0.018164
    alloc_rotor1_px: -0.22990663
    alloc_rotor1_py: -0.22990663
    alloc_rotor1_km: 0.018164
    alloc_rotor2_px: 0.22990663
    alloc_rotor2_py: -0.22990663
    alloc_rotor2_km: -0.018164
    alloc_rotor3_px: -0.22990663
    alloc_rotor3_py: 0.22990663
    alloc_rotor3_km: -0.018164
    alloc_thrust_coeff: 4.260431e-05
    alloc_omega_idle: 64.0603
    alloc_omega_max: 730.0507
    alloc_motor_idle: 0.0
    alloc_motor_max: 1.0

    # ══════════════════════════════════════════════════════════════════════
    # 3. SIM-TOPOLOGY DIFFERENCES -- the only deliberate departures from 2
    # ══════════════════════════════════════════════════════════════════════
    # (a) SAFETY-revert arm fold. On hardware this node calls the arm
    #     controller's go_home 1 s after a revert; in the Isaac rig arm_planner
    #     (torque_controller_isaac_aerial.yaml, home_on_safety_revert: true)
    #     owns that edge, so the service is EMPTY here -- exactly one of the
    #     two may be active or the arm is commanded twice.
    system_arm_go_home_service: ""
    system_arm_go_home_delay_s: 1.0
    # (c) Arm sign map. Hardware joint1/joint4 are URDF/Dynamixel convention,
    #     opposite the whole-body model (wb_arm_sign_j1/j4 = -1). Isaac
    #     publishes the model convention, so the keys are OMITTED (identity).
    # (d) The planner's base_com / arm_joint_sign (section 4): the hardware
    #     launcher passes them on the command line; the sim stack launches the
    #     planner on this file alone, so they are set IN the file.

# ============================================================================
# 4. WHOLE-BODY TRAJECTORY PLANNER (fsc_trajectory_planner, C++) -- hardware
#    verbatim except base_com (3d). LEGACY whole_body_planner section kept for
#    the python-era key.
# ============================================================================
/**/whole_body_planner:
  ros__parameters:
    planner: "bspline"

/**/whole_body_trajectory_planner:
  ros__parameters:
    vehicle: "t650_aerial_manipulator"
    planner: "bspline"
    stream_rate: 100.0
    v_max: 0.30                 # peak CoM speed              [m/s]
    a_max: 0.15                 # peak CoM acceleration       [m/s^2]
    w_max: 0.30                 # peak rate, any angle channel [rad/s]
    t_min: 3.0                  # never faster than this      [s]
    dw_max: 0.60                # bspline: peak angular acceleration [rad/s^2]
    t_max: 40.0                 # bspline: refuse rather than crawl   [s]
    tau_joint_max: 3.0          # bspline: MUST equal wb_tau_max above
    rotor_bounds: true          # bspline: rotor bounds via inverse dynamics
    n_check: 101                # diagnostic grid; 0 disables
    home_pose: [0.0, 0.698132, 0.698132, 0.0]
    hold_ee_world: false
    # Servo armature: MUST equal wb_armature_joint_diag / wb_armature_j1..j4
    # (the planner's joint-torque feasibility and reference torques use it).
    # Mirrors the hardware yaml; missing here until 2026-09-27, so the sim's
    # planner built its references on the old link-armature model.
    armature_joint_diag: true
    armature: [0.010, 0.0194, 0.0097, 0.0097]
    # = wb_base_com_* (the hardware launcher passes the same three numbers);
    # arm sign identity in Isaac (3c).
    base_com: [0.0, -0.017854, 0.0]
    arm_joint_sign: [1.0, 1.0, 1.0, 1.0]

    # --- end-effector trajectory mode (arm GS "EE trajectory" tab) ------
    # The 0924 circles: r 0.5 m, 24 s lap, ONE lap (F2-F4; F1 flew laps 2),
    # fold 60, q2 30 +- 10 deg at a 48 s period (F1/F2); F3/F4 flew fold 55,
    # q2 25 +- 15 at 12 s / 6 s -- set those per replay, as the flights did.
    ee_traj_circle_radius: 0.5      # [m]
    # FIGURE-8 (2026-10-05, Pegasus docs/docs_aerial_manipulator/archive/
    # figure8_compare_20261005): "radius" = the half-length A. FIRST-FLIGHT SETTING
    # A 0.70 / B 0.35 m at a 0.10 m/s mean EE speed (the arm GS's Figure-8 defaults:
    # path 4.2681 m -> a 42.68 s lap, q2 period 10.67 s via ee_traj_q2_cycles_per_lap).
    # Chosen from the conservative sweep: the geometric (decoupled) EE peak scales
    # with the peak YAW RATE, and at 0.10 m/s it is 73 mm in sim (~121 mm predicted
    # in flight, sim/flight 0.6), the 8 + errors fitting a 2 x 2 m square with
    # +110 mm per side. Faster steps flown in sim: 0.15 m/s (geo peak 91 mm),
    # 0.20 m/s (128 mm). The 8 is centred on the EE's HOVER point (the crossing).
    ee_traj_fig8_a: 0.70            # figure-8 half-length along its long axis [m]
    ee_traj_fig8_b: 0.35            # half-width across it [m] (B = A/2)
    # LONG AXIS ON WORLD x (2026-10-05, user request): without this the 8 starts along
    # the nose with its long axis ~45 deg off it (diagonal from a yaw-0 hover). The
    # crossing stays at the hovering EE; go-to-start yaws the drone by at most 45 deg.
    ee_traj_fig8_world_axis: true
    ee_traj_fig8_axis_deg: 0.0      # long-axis azimuth, world frame [deg] (0 = x, 90 = y)
    ee_traj_lap_time: 24.0          # one lap at time scale 1 [s]
    ee_traj_laps: 1
    ee_traj_ccw: true               # circle turns counter-clockwise
    ee_traj_center_origin: true     # circle centred on the world origin at the EE height
    ee_traj_ramp_time: 4.0          # min-snap ramp-in / ramp-out [s]
    ee_traj_fold_deg: 60.0
    ee_traj_q2_center_deg: 30.0     # the assigned redundancy DoF: q2 sinusoid
    ee_traj_q2_amp_deg: 10.0
    ee_traj_q2_period_s: 48.0
    # q2 PERIOD TIED TO THE LAP (2026-10-05): > 0 makes the planner use
    # lap_time / cycles and IGNORE ee_traj_q2_period_s, so whatever lap the arm GS
    # writes (circle 24.166 s -> 6.0415 s; figure-8 A 0.70 at 0.10 m/s 42.68 s -> 10.67 s,
    # 8.8 deg/s peak q2 rate at s = 1; A 0.75 at 0.20 m/s 22.865 s -> 5.716 s)
    # stays on whole cycles and the run ends on its start pose. 0 = use the period above.
    # SIM: 0 keeps this file's 48 s design (half a cycle per 24 s lap); the
    # hardware file sets 4. The figure-8 campaign set 4 at run time.
    ee_traj_q2_cycles_per_lap: 0
    # RATE BOUNDS FOR THE EE RUN ONLY (2026-10-05; > 0 overrides v_max/a_max/w_max for
    # this mode, 0 = inherit). The shared bounds above also size every transition
    # (go-to-start, back-to-origin, GS targets) and would cap the 0.20 m/s figure-8 at
    # s = 0.34. With these: s_max 1.06 (set by v_max 0.30), the circle's s = 1 plan is
    # unchanged (only its s_max rises). Sim-flown 3+3 at s = 1, both rigs, 0 saturation.
    ee_traj_v_max: 0.0              # 0 = v_max (0.30 m/s; figure-8 peak 0.28)
    ee_traj_a_max: 0.40             # CoM acceleration [m/s^2]; figure-8 peak 0.33
    ee_traj_w_max: 1.0              # yaw rate [rad/s]; figure-8 peak 0.90 (51 deg/s)
    ee_traj_qdot_max: 0.5           # [rad/s]
    ee_traj_time_scale: 1.0         # the default request; the GS slider overrides
    ee_traj_start_pos_tol: 0.05     # Start button gate: [m], [deg], [deg]
    ee_traj_start_yaw_tol_deg: 5.0
    ee_traj_start_joint_tol_deg: 5.0

    # --- pick-and-place mode (arm GS "Pick & Place" tab), 2026-10-03 -------
    # THE TASK, IDENTICAL ON HARDWARE AND IN SIMULATION (this block is in the
    # hardware file and, verbatim, in section 2 of the mirror ..._sim.yaml).
    # Without it the planner flies its built-in defaults -- pick / place arm
    # pose [0, 0, 0, 0], carry = the folded home pose, every yaw 0 (no turns).
    # The decoupled stacks read their planner section from this file too.
    # Record: Pegasus docs/docs_aerial_manipulator/archive/pick_place_controllers_20261003/.
    #
    # Drone points [x, y, z, yaw_deg] (world, ACTUAL yaw) -- the sim field's
    # nominal points. Adjust (arm GS, vehicle on its start mark) writes a
    # common x / y / yaw shift into all four; CHECK THEM AGAINST THE LAB.
    # Yaw sequence CLOCKWISE, flown as typed: pick at the payload's yaw (0,
    # pick_place_align_yaw), round to -180 for the place, on to -360 to land
    # (+180 / +360 would turn the other way).
    pick_place_start: [0.0, 0.0, 1.0, 0.0]
    # PICK-AND-DROP ROUTE (2026-10-14, user design): the clockwise loop of the
    # pick-and-place, NOT a straight move back -- start (0, 0) -> pick NE (1, 1)
    # -> PLACE START in the FRONT-RIGHT area (0.8, -1), ~2 m from both pillars
    # (user: x 1.0 -> 0.8) -> the bin at (-1, -1), approached from the east
    # facing it (yaw -180, the user's drop heading) -> withdraw back from the bin
    # -> Land Start / Land at (-0.5, 0.8) (user, 2026-10-14: land further away).
    # ALTITUDES: pick ~1.07 m body -> exit_pick climbs to ~1.27 -> Place Start at
    # 1.0 (user, 2026-10-15; it was a LOW 0.70 for the 172 mm box) -> Ready To
    # Place flies straight to the drop (Drop point + Drop Margin, body ~1.31 m over
    # the 35 mm tray), the arm sweeping on the way, like the set-down's Ready To
    # Place (user, 2026-10-15: no early-climb transition) -> Place opens the
    # gripper -> Exit To Place starts by itself (the arm GS) from where the drone
    # is, backs out the Side Margin (+x, away from the bin) and climbs the
    # Vertical Margin, and HOLDS there (user, 2026-10-15: out of the bin's
    # downwash) -> Go To Land Start folds the arm, the GS closes the gripper ->
    # Land 0.35 (11.5 cm above touchdown on the T650
    # gear, body rests ~0.235 m; 4.5 cm on the sim's X650 gear, 0.305 m --
    # pick_place_fence_min_z below lets it). At Place Start the carried basket's
    # bottom is ~0.44 m above the floor.
    pick_place_place_start: [0.8, -1.0, 1.0, -180.0]
    pick_place_land_start: [-0.5, 0.8, 1.0, -360.0]
    pick_place_land: [-0.5, 0.8, 0.35, -360.0]
    # the geofence FLOOR on the body origin, every leg: 0.30 m so Land can be
    # 0.35 (node default 0.6 -- only the land leg goes below it)
    pick_place_fence_min_z: 0.30
    pick_place_align_yaw: true
    # Arm poses [deg, q1..q4] -- THE BOX PAYLOAD (2026-10-07, user's CAD: a basket
    # with a wire HANGER on top; the claw takes the vertical stem with one finger
    # on each side, both UNDER the arch, and the lift hangs the arch on them).
    # The fingers must pass under the arch, so the claw is near HORIZONTAL
    # (beta = q2 + q3 ~ 70-75). Inside the real arm's q2 range -20..+45 (U2D2
    # board) and q3's +50 stop. Sized on the measured excursions, not the
    # nominal pose: the SET-DOWN (the basket's weight leaving the claw) springs
    # the arm UP by +5..+8 deg on q2 and q3, the LIFT dips q2 by -10..-12.
    # PICK / PLACE [0, 32, 38, 0]: beta 70, the claw 20 deg below horizontal;
    #   flown 3/3 (hook3/5/6, Isaac): q2 peaked 38.9-40.1 at the set-down, q3
    #   44.2-45.5 -> 5-6 deg to +45 / +50; q2 never below 20 (40 deg off -20).
    # CARRY UNTIL 2026-10-16: [12, 38, 42, 0] (2026-10-07, user: a pose clearly
    #   different from the pick pose, to SHOWCASE the arm moving with the payload):
    #   the arm yaws 12 deg and folds up 10 deg -- the hung basket lifts 37 mm and
    #   swings 53 mm sideways (65 mm). The yaw is capped by the landing gear: the
    #   hung basket clears the skids by 29 mm at rest here, by ~1 cm at 15 deg.
    #   beta 80 (claw 10 deg down: flatter than the pick pose, so the hook needs
    #   LESS friction while carrying); 7 / 8 deg to the q2 / q3 stops before the
    #   +2..+3 deg measured in carry. (q1 does not change sigma_nd.)
    #   FLOWN 2/2 (hook9/10, Isaac): the hung basket moved 63 / 69 mm (body
    #   frame) between the carry and place poses, vs 20-25 mm with the old
    #   [0, 35, 40, 0]; skids >= 32 mm; carry-leg peaks q2 39.3, q3 44.5;
    #   placed 53 / 28 mm off axis (the 53 = a deeper hook at the PICK).
    # sigma_nd >= 0.31 everywhere flown (keep-out 0.10, the law's 0.87); J2 / J3
    # hold ~1.2 / 0.6 N.m with the 200 g basket hung.
    # FRICTION IS A REQUIREMENT, NOT A POSE CHOICE: the arch rests on the fingers'
    # top edges, which slope down toward the tips by the claw tilt + ~6 deg of
    # taper (~26 deg at the pick pose, ~21 at beta 75). Isaac at the scene's
    # mu 1.2: 3/3 placed (hook3 knocked off only before the hook-place fix);
    # at mu 0.4 the arch slid off the fingers at the lift with BOTH beta 70
    # and beta 75 (hook7/8). On hardware give the finger tops mu >~ 0.6
    # (rubber / grip tape) or a notch on the arch.
    # Record: Pegasus docs/docs_aerial_manipulator/archive/pick_place_box_payload_20261007/.
    pick_place_pick_pose_deg: [0.0, 32.0, 38.0, 0.0]
    pick_place_place_pose_deg: [0.0, 32.0, 38.0, 0.0]
    # CARRY = THE PICK / DROP POSE SINCE 2026-10-16 (user decision after the 10-15 pick-and-drop
    #   flights, Pegasus archive/wb_pick_drop_flight_20261015): the arm is held FIXED from the
    #   pick to the drop. With the basket hung, the old carry pose's 12 deg arm yaw and loaded
    #   fold-up (j3 at its 1.42 N.m cap for 3.7 s, needing 1.74) came just before the wrist roll
    #   q4 broke loose and swung +-18 deg at 0.5 Hz, rocking the vehicle +-3-4 deg into the drop.
    #   The no-payload run flew the same arm motion with 0.1-0.3 deg, so the motion is harmless
    #   unloaded; with the load it only adds kicks to an undamped wrist. The SET-DOWN profiles
    #   (*_pick_and_place.yaml) keep [12, 38, 42, 0] by override, as flown 10-08..10-10.
    pick_place_carry_pose_deg: [0.0, 32.0, 38.0, 0.0]
    # No arm sweep on the way to the place (three poses only): lo == hi.
    pick_place_sweep_lo_deg: [0.0, 32.0, 38.0, 0.0]
    pick_place_sweep_hi_deg: [0.0, 32.0, 38.0, 0.0]
    pick_place_sweep_phase_deg: [0.0, 90.0, 270.0, 0.0]
    # EE offset [m]: basket centre (obj_0) -> the claw point, ONE for pick and
    # place, in the object's frame (+x = the hanger plane's normal, the claw's
    # approach direction; +z up). THE BOX PAYLOAD: the stem is at x = -27.5 mm,
    # the arch's underside 199 mm above the basket centre; the claw point goes
    # 7.5 mm BEYOND the stem (the stem 8 mm deep between the 30 mm-tall
    # fingers, 24 mm short of their tips) and 0.16 m up, where the open
    # fingers' tops pass 21 mm under the arch and 10 mm under its curving arms.
    # The lift then raises the claw 21 mm before the arch settles on the
    # closed fingers. TUNE ON THE REAL PAYLOAD -- the arm GS's EE Offset row
    # writes it live.
    pick_place_ee_offset: [-0.02, 0.0, 0.16]
    # PLACE pose [x, y, z, yaw_deg] = where the payload's centre is RELEASED, in
    # obj_0's frame. Since 2026-10-14 (user design) the payload is DROPPED into a
    # plastic box (37.1 x 29 cm; walls CUT 17.2 -> 3.5 cm, 2026-10-15) standing on the place hat, TURNED 90 deg
    # (user, 2026-10-14) so its length runs along y (pick_place_place_drop below). THE WORKFLOW (user,
    # 2026-10-15): put the box's COVER on, set the basket on the cover, press the
    # Drop row's Get (x, y, z -- no hand correction), type the yaw, remove the
    # cover. The gripper opens pick_place_drop_height (the arm GS's Drop
    # Margin) above this point. Adjust never moves it. Default: the lab's 0.77 m
    # pillar + 8 mm hat + 35 mm tray = rim 0.813 m, + 32.5 mm half basket =
    # 0.8455 m (cover thickness 0; no cover on the cut tray: anything flat laid
    # across the rim). YAW -180 (user, 2026-10-14: the drop heading) puts the
    # payload's 306 mm (its two side mocap balls) along world y = the turned box's
    # 371 mm length (~366 inside), its 227 mm across the 290 mm width (~285 inside).
    pick_place_place_point: [-1.0, -1.0, 0.8455, -180.0]
    # Safety Margin: Ready To Pick / Place hover this far above the EE target,
    # Exit To Pick / Place climb back to it. Pick / Place descend on request.
    pick_place_approach_dz: 0.20
    pick_place_descent_on_request: true
    # Exit To Pick / Place duration: 0 = the leg bounds (3.2 s for the 0.20 m
    # climb). THE BOX PAYLOAD (2026-10-07): the hook is not a clamp, so nothing
    # pins the vehicle to the pillar and the lift should be GENTLE -- at 1.6 s
    # the arch engaged at ~0.15 m/s, the basket swung to 21 deg and q2 dipped
    # 13.6 deg (hook1). 1.6 s was for the clamped handle plate
    # (PEGASUS_PNP_PAYLOAD=plate): a 3.2 s climb left that box on the cap
    # ~0.9 s and the decoupled rig, pinned to it, tipped over (2026-10-03).
    pick_place_exit_time_s: 0.0
    # Descent trim cap: the decoupled law parks its claw ~5 cm off (up to
    # 74 mm at the place); the trim cancels it. The 50 mm residual gate after
    # the trim is unchanged; the whole-body law trims 1-7 mm.
    pick_place_descent_trim_max: 0.15
    # TRIM FIRST: a trim over 5 mm is flown sideways at the hover height, held
    # 2 s, then the claw descends STRAIGHT down. Flown inside the descent, the
    # decoupled law's ~5 cm trim overshot ~10 mm at the bottom -- beyond the
    # open fingertips' 8.75 mm clearance of the handle (2026-10-03, geo_22).
    pick_place_descent_trim_settle_s: 2.0
    # Safety guard: ABORT's response once the tilt stays above 15 deg for 0.1 s.
    pick_place_guard_tilt_deg: 15.0
    pick_place_guard_persist_s: 0.10
    # ABORT, two-step arm (2026-10-09, user design): the gripper opens, the arm
    # goes to this RELEASE pose while the vehicle climbs (claws 60 deg down: an
    # arch still hanging on the open fingers slides off), holds it, then folds
    # home; the arm GS closes the gripper when the abort completes.
    pick_place_abort_release_pose_deg: [0.0, 0.0, 30.0, 0.0]
    pick_place_abort_release_hold_s: 2.0
    # World-held claw for the pick hover / descent / grasp only (the whole-body
    # node's set_ee_anchor_com; the decoupled node has none, so it is a no-op).
    # The box payload's hook grasp keeps the CoM anchor for the pick too: the
    # fingers have ~17 mm to spare around the stem, and the world-held claw
    # swings q2 by up to 12 deg (2026-10-06 screen) -- past the real arm's +45.
    pick_place_world_anchor_pick: false
    pick_place_world_anchor_place: false
    # HOOK GRASP (the box payload, 2026-10-07): the pick comes in level from
    # 0.10 m behind the stem, the place exit backs out 0.10 m before climbing
    # (the fingers must slide out from under the arch, not lift it again).
    pick_place_pick_approach_back: 0.10
    pick_place_place_exit_back: 0.10
    # DROP PLACE (2026-10-14, user design; the payload's holder has NO arch any
    # more, so opening the jaws releases it): Ready To Place flies the claw
    # straight to the DROP POINT -- the place claw target raised by
    # pick_place_drop_height -- and holds there; Place OPENS the gripper (the
    # payload falls into the box); Exit To Place backs off
    # pick_place_place_exit_back and climbs pick_place_approach_dz to a safe
    # point beside and above the box. No descent. THE DROP MARGIN (2026-10-15,
    # user design; the arm GS's Pick & Drop "Drop Margin" box writes it live):
    # the payload's centre is this far above where it stood on the cover (the
    # place point) when the gripper opens, and this alone sets the drop's height.
    # 0.20 m (user, 2026-10-15; 0.10 = the 10-14 flights' release): the basket's
    # bottom ~20 cm above the rim; over the 35 mm tray (rim 0.813 m) the body
    # flies ~1.31 m. In the
    # place pose the claw is 0.256 m ahead of and 0.102 m below the body origin.
    # false = the set-down place.
    pick_place_place_drop: true
    pick_place_drop_height: 0.20
    # THE PRESCRIBED DROP ALTITUDE (2026-10-14: the BASE at 1.35 m) is RETIRED
    # (2026-10-15, user design): 0 = off, the drop margin above sets the
    # height. Place only opens the gripper; Exit To Place backs out and climbs.
    pick_place_drop_altitude: 0.0
    # Ready To Place's altitude change over the whole leg: 1.0 = the straight
    # transition the set-down's Ready To Place flies (user, 2026-10-15: remove
    # the early-climb transition; it was 0.5 -- the climb done in the first half
    # -- for the LOW 0.70 m Place Start). From the 1.0 m Drop Start the diagonal
    # still crosses the tray's wall with the basket ~15 cm above the rim.
    pick_place_drop_climb_lead: 1.0
