    # (2026-11-02) the VALVE'S EXIT ORDER is kept on purpose (the arm GS's push_pull_valve_box_exit
    # false, the default): open with the claw held in the room, then this room-held climb. The
    # box's release-first order was tried on the valve in Isaac (10-18: 2 of 7 vs 3 of 3).
    # 2026-11-02 (THE U PUSH): 0.12 -- the claw point is now 80 mm under the fin top and the claws
    # reach ~95 mm down it; 0.12 m clears the top by ~25 mm before the claw follows the vehicle.
    push_pull_exit_world_held_dz: 0.08  
    # WHEN the law's contact phase switches -- the GRIPPER is the signal (the
    # box push's rule): on at the Push press (the jaws' stall), free when the
    # turn completes, before the jaws open.
    # push_pull_contact (planner, default true): false = the planner never calls the law's
    # set_contact -- the turn flown in the FREE phase (an A/B knob, 2026-10-17: the fin's
    # reaction is ~0.3 N at the conservative bearing; the free-phase observer may absorb it).
    push_pull_contact: true
    push_pull_contact_at_ready: false
    push_pull_contact_off_at_push_end: true
    push_pull_unload_time_s: 0.0
    # The claw WORLD-held through the turn, as the box push (v3 / v5, 2026-10-15):
    # the planned circle is the fin's, so base drift loads nothing but the
    # bearing and the arm absorbs the base's lag. CoM-anchored instead (v4),
    # the arm kept its pose but the claw reference followed the base's
    # fore-aft slosh, the claw's heading no longer matched the fin's, the
    # wrist rolled to -55 deg and the fin was wrenched out of the jaws 16 s in
    # (the node's watchdog handed over). The hover and the descent stay
    # CoM-anchored with the world hold from the arrival on the fin, no descent
    # trim (the box push's, README 4.6).
    # 2026-10-27 (archive/valve_turning_v2_20261027, the v2 valve at its measured
    # 0.072 N.m): THE DESCENT IS NOW ROOM-HELD TOO. Under the hardware-like drift every
    # CoM-anchored descent let an open finger meet the fin 11-16 mm off radially and
    # drag the valve 12-18 deg before the close (0 of 3; the settle gate 1 of 3);
    # room-held from the end of Go To Start the arm flies the slide-in, the radial
    # offset stayed <= 6.2 mm and the fin moved <= 0.2 deg (3 of 3 + 1 of 1 nominal).
    # The handle settle below is then inert (it only runs when the room hold starts
    # at the handle).
    # 2026-11-02 (user: the valve's approach the 10-27 box way; Pegasus archive/
    # valve_box_isolation_20261102): BACK TO THE BOX'S -- the descent CoM-anchored, the claw
    # handed to the room hold only once settled on the handle (the settle below), contact on
    # the planner's events. The 10-27 room-held descent above, its leash, Ready gate and
    # descent guard are off: the 10-31 evening failure began in that pre-grasp room hold.
    # (Isaac 10-27 under drift: room-held 3 of 3, the box's settle 1 of 3 -- the user's call.)
    push_pull_world_anchor_push: true
    push_pull_world_anchor_ready: false
    push_pull_world_anchor_on_handle: true
    # THE HAND-OVER SETTLE (the box push's 2026-10-24 hardware lesson, archive/
    # wb_box_pushing_flight_20261024 section 8): the room hold waits until the claw is
    # within settle_tol of the grasp point, axis_tol across the fin and slower than
    # max_speed for dwell_s (a base 30 mm off when the hold engaged made the arm reach);
    # Ready is refused until the claw has been still ready_settle_s at Go To Start.
    # 2026-11-02: the box push's own values (its 10-27 flights), with the box's approach above.
    push_pull_handle_settle_tol: 0.025
    push_pull_handle_settle_axis_tol: 0.015
    push_pull_handle_settle_max_speed: 0.030
    push_pull_handle_settle_dwell_s: 0.3
    push_pull_ready_max_speed: 0.030
    push_pull_ready_settle_s: 0.5
    push_pull_descent_trim: false
    # THE WAY HOME (2026-10-27, the box push's 10-21 landing): Go To Land Start flies
    # back over the start mark at 1.3 m, Land straight down to 0.30 m (skids ~5 cm off
    # the floor), yaw 0 = facing the valve as at take-off (after the 90 deg turn the
    # heading is already ~0: Go To Land Start takes the shortest turn). Adjust writes
    # the measured x, y shift into all three.
    # 2026-10-28: over the start mark (-1.0, 0) of the box push's layout (was (0, 0)).
    push_pull_land: [-1.0, 0.0, 0.30, 0.0]
    push_pull_land_start: [-1.0, 0.0, 1.3, 0.0]
    push_pull_start_mark: [-1.0, 0.0, 1.0, 0.0]
    # THE TABLE keep-out [x_min, x_max, y_min, y_max, z_top] (world) and THE
    # VALVE's swept circle as a second one, z_top = the BEAM top (the fin is
    # the handle: the claw goes below its top on purpose, between the skids):
    # the gear and every arm point over either keep 5 cm clearance.
    push_pull_table: [0.600, 0.750, -0.5, 0.5, 0.80]
    push_pull_obstacle: [0.475, 0.875, -0.200, 0.200, 0.8540]
    # THE KEEP-OUTS PLACED FROM THE VALVE (2026-10-27, user; the box's table-from-box):
    # the two above are then IGNORED (they document the scene) -- at Plan the beam's
    # swept square (+-valve_reach) is centred on the captured axis, its top
    # valve_top_above over the axis point; the table push_pull_table_size [length, depth]
    # centred on the axis, its depth along the line from the start, its top AT the axis
    # point (obj_0 + push_pull_valve_axis_offset: on the plate bottom = the table top). In this
    # scene they equal the two above to the millimetre. Plan refuses a start outside
    # valve_start_range from the axis and a beam (obj_0 +x) more than beam_tol_deg
    # away from the start -- the layout rule (the valve clamped in the table's middle,
    # the vehicle in front, the fin toward it) and the catch for a turned mocap body.
    push_pull_keepouts_from_valve: true
    push_pull_valve_reach: 0.2001
    push_pull_valve_top_above: 0.0540
    push_pull_table_size: [1.0, 0.15]
    push_pull_valve_start_range: [0.6, 3.0]
    push_pull_valve_beam_tol_deg: 45.0
    push_pull_table_clearance: 0.05
    # THE LANDING GEAR: the T650's -- skids 0.2425 m under the body origin
    # (the scene's AM_T650.usda).
    push_pull_gear_depth: 0.2425
    # Isaac has no ceiling (the lab's must be set on hardware)
    push_pull_fence_max_z: 2.2
    # the Land hover at 0.30 m (2026-10-27): the fence floor below it (node default 0.6)
    push_pull_fence_min_z: 0.25
    # SAFETY GUARDS -> ABORT (contact off, release, climb 0.30 m, arm home):
    # tilt > 10 deg for 0.1 s; the task force the law reads > 5 N for 0.3 s
    # while in contact (the bearing needs ~0.2 N at the fin; the bench's
    # along-arm capacity ~6 N). 2026-10-18 (README 14): the tilt guard was 15
    # deg = the node's own watchdog, so the node always tripped first -- and a
    # watchdog trip hands over to SAFETY with the jaws still CLOSED on the fin
    # (every recorded failure then tore the fin out and fell 1 m, most of them
    # inverted). At 10 deg the planner aborts first in 27 of the 34 recorded
    # failures (0.1-5.9 s ahead of the watchdog), against 1 of 26 completed runs
    # (completed turns peak at 4.4-7.5 deg, free flight at <= 6.3).
    push_pull_guard_tilt_deg: 10.0
    push_pull_guard_force_n: 5.0
    # THE ABORT ON THE FREE HANDLE (2026-10-18, README 15.2): hold the PLANNED pose
    # the turn was cut at, keep the claw world-held while the jaws open (2 s: the
    # jaws' full opening in Isaac is ~1.5 s, and the planned hold unfolds the arm off
    # its stops meanwhile), then the STRAIGHT climb of the nominal exit. Flown:
    #  * from_measured (the jammed box's fix): the hold kept the arm on both stops and
    #    the climbing claw caught the fin (s_abort20, s_abort33: DIRECT lost);
    #  * cut hold + backing out 0.12 m along the nose first: the open pads dragged the
    #    fin, the beam rotated back 40 deg, DIRECT lost (s2_abort20, s2_abort33; clean
    #    only at 8 s, s2_abort8);
    #  * cut hold + 2 s + straight climb: CLEAN at 33 s (a_abort33: DIRECT kept, tilt
    #    <= 1.9 deg) -- a vertical climb drags the fin along the axis the bearing holds.
    # An abort from an arm already on its stops or oscillating is not recoverable by
    # any of these (README 15.2): the guard is what keeps it from getting there.
    #
    # 2026-11-02 (archive/wb_valve_turning_flight_20261101, the 175932 crash): THE ABORT
    # RECIPE IS THE BOX PUSH'S (10-27, flown): hold where the vehicle IS (from_measured),
    # the claw on the CoM anchor through the release (world_held false -- the sway and arm
    # guards already drop the room hold, so the key did not act on 11-01), 1.0 s for the
    # jaws (sim; the hardware generator writes the box's 1.5 s), straight up.
    # push_pull_abort_unbuckle stays off (below): the one box abort key not carried.
    # NOT A FIX FOR THE 11-01 CRASH: there the sway guard fired with the base 32-44 mm from
    # the planned hold but moving at ~350 mm/s; every abort leg is rest-to-rest, so the base
    # overshot to 149 mm and rang at 0.5 Hz, and the claw (CoM anchor) swept the opening
    # jaws across the fin for 2 s and caught it in the climb. Holding the measured pose
    # removes only the 32-44 mm. It also reverses the 10-18 result above (from_measured
    # with the world-held release). UNTESTED in this combination.
    push_pull_abort_from_measured: true
    push_pull_abort_back: 0.0
    push_pull_abort_release_wait_s: 1.0
    push_pull_abort_release_world_held: false
    # THE ABORT, 2026-11-02 (user design, archive/valve_cup_abort_20261102), replacing that release
    # wait: the arm GS opens the jaws at once (the button or a guard's ABORTING); the planner holds
    # where the vehicle IS only until the GS reports them FULLY OPEN (push_pull/abort_jaws_open, on
    # the open goal's result) and climbs at that instant -- no fixed window, so
    # push_pull_abort_release_wait_s is unused. No report within push_pull_abort_open_timeout_s (the
    # station down, the WiFi lost, an open that failed): it climbs anyway. The claw FOLLOWS THE
    # VEHICLE from the first tick (the node's fast blend), never held in the room. With the GS's
    # half close (push_pull_valve_cup) the claw is never clamped to the bolted-down valve, so a
    # claw that follows the vehicle slides along / off the fin instead of loading the arm.
    push_pull_abort_climb_on_open: true
    # ... the user's details (2026-11-02, the morning's design): "open" is the gripper READING open --
    # its own joint state, read by the planner (on hardware the Orin, no WiFi in between; the arm
    # GS's report on the open goal's result also counts, whichever comes first) -- at most ~1 s
    # without either; the climb (2026-11-03) is ONE leg, below
    push_pull_abort_open_timeout_s: 1.0
    push_pull_abort_gripper_topic: "isaacsim_manipulator/gripper_state"
    push_pull_abort_gripper_joint: "gripper_joint"
    push_pull_abort_gripper_open_at: -0.03
    # ONE CLIMB (2026-11-03, user: the abort climbed twice -- a short stop, then higher): the fast
    # leg now IS the whole climb. Two rest-to-rest legs (60 mm in 0.8 s, then the rest of the
    # 0.30 m) stopped the U push's claw ~20 mm under the fin top, beside the fin, with the claw
    # following the vehicle; and with the jaws already open the fast start had no purpose left.
    # One min-snap leg, 0.30 m in 1.5 s (user, same day: "executed immediately without any waiting
    # time / hesitation" -- 2.5 s started too gently, 10 mm only after 0.5 s): it STARTS like the old
    # 60 mm / 0.8 s leg (10 mm at 0.30 s, it was 0.28) and never stops; the claw clears the fin top
    # (80 mm) ~0.6 s in; peak 0.44 m/s / 1.0 m/s^2 (the old leg: 0.70 m/s^2). Then the arm folds home
    # (the planner: a fast leg that covers the whole climb is the climb, the fold starts from it).
    push_pull_abort_climb: 0.30
    push_pull_abort_fast_climb: 0.30
    push_pull_abort_fast_climb_s: 1.5
    push_pull_abort_fast_follow: true
    # THE EXIT-WINDOW ABORT (earlier on 2026-11-02: the claw HELD IN THE ROOM until it had climbed
    # clear of the fin) is OFF: it contradicts the claw following the vehicle.
    push_pull_abort_exit_hold: false
    # ... the wait is capped on a MOCAP-GUARD abort (2026-10-22, archive/valve_turning_safety_20261022):
    # the world is then EKF2 dead-reckoning -- the claw follows the vehicle anyway, and the wait at
    # fin height is at most 0.7 s (the jaws clear the 5 mm fin; hardware opens in 0.65-0.70 s) so the
    # drifting vehicle does not sweep the open claw into the fin: the climb starts at the OPEN
    # report or at 0.7 s, whichever comes first
    push_pull_abort_mocap_release_wait_s: 0.7
    # push_pull_abort_unbuckle (the box push's 2026-10-21 fix) acts only on an abort held on the
    # MEASURED arm, and stays OFF with the planned hold: flown 2026-10-22 as measured hold +
    # unbuckle, it CRASHED the injected mid-turn abort (arm on both stops: unbuckling during the
    # climb dragged the open claw through the fin, rotor +98 deg, inverted), was clean at 33 s,
    # recovered one slowly buckled arm (q3 -16 deg) and lost the heavy valve 2 of 2 -- as the
    # planned hold did. Nothing recovers an arm buckling at ~25 deg/s on a heavy valve.
    push_pull_abort_unbuckle: false
    #
    # THE BOX PUSH'S GUARDS, CARRIED OVER (2026-10-22, archive/valve_turning_safety_20261022;
    # thresholds re-chosen on the 118 recorded valve runs, tools/valve_guard_replay.py):
    #   box_tilt_deg: the ROTOR tilted > 2 deg from its pose when the claw first sat on the
    #     fin, for box_persist_s -- the rig lifting off the table or its clamp giving, not a
    #     turn (a turn is a yaw). Isaac's rotor is on a revolute joint (0 deg); the hardware
    #     box read <= 0.7 deg clamped (2026-10-21).
    #   box_stale_s: no rotor sample for 0.5 s, or the same pose repeated (the processor
    #     republishing a body it lost) -- the guard above is blind. Armed by the tilt guard.
    #   q3_min_deg 3.0, NOT the box's 10: completed valve turns dip q3 to 9.8-10.7 deg on this
    #     config (the results campaign) and a 10 deg guard would have tripped 20 of 57 completed
    #     runs; < 3 deg for 0.2 s trips none of the current config's completed turns (two old-
    #     config stress runs only) and 17 of 50 failures, 0.4-17 s before the tilt guard. It
    #     also aborts when the arm's joint states go silent for box_stale_s (the guard is blind).
    #   q3_lookahead_s 0 (the box's RATE guard OFF -- 2026-10-22; SUPERSEDED 2026-10-28 night, see below:
    #     0.1 s with a 30 deg/s floor and the q2-wall credit): the valve's arm folds and unfolds fast in a
    #     NOMINAL turn -- at the box's 10 deg / 0.2 s it false-trips 41 of 57 completed runs, and
    #     no lower limit separates the failures from those.
    #   NO turn-lag guard (the box-lag analog): the rotor's lag behind the plan stays <= 10 deg
    #     in completed turns, but the heavy-valve failure (damping 2.0, base_visc) buckled the
    #     arm with only 11 deg of lag -- no threshold separates them; the q3 guard caught it 3.8 s
    #     before the tilt guard.
    #   box_tilt_deg 4.0, NOT 2.0 (2026-10-28 hardware, archive/wb_valve_turning_flight_20261028):
    #     both hardware turns were cut by a FALSE 2 deg trip -- obj_0's z axis reads 0.3-1.7 deg rms
    #     of noise near the claw (spikes 4-10), and a body 1.5 deg off the shaft reads 2.1 deg of
    #     tilt over a clean 90 deg turn by itself. Replayed, 3-4 deg / 0.2 s trips neither flight.
    #     The persistence stays 0.2 s: the static q3 guard shares it.
    push_pull_guard_box_tilt_deg: 4.0
    push_pull_guard_box_persist_s: 0.20
    # 0.20 s (2026-11-03; was 0.50): the valve's mocap AND the arm's joint states -- the fin-in-the-U
    # monitor and the clearance guard both need them; a silent, frozen or jumping feed aborts
    push_pull_guard_box_stale_s: 0.20
    push_pull_guard_q3_min_deg: 3.0
    # the q3 RATE rule ON since 2026-10-28 night (0.0 = off, the 10-22 setting):
    push_pull_guard_q3_lookahead_s: 0.1
    # The q3 RATE rule's other settings (2026-10-28, archive/wb_valve_turning_flight_20261028). With the
    # look-ahead 0.1 s: Isaac 4 drift runs, no false trip. Replayed on 77 valve runs, look-ahead 0.1 s / 30 deg/s / q2 wall 45 caught
    # 9 of 11 buckles before q3 crossed 0 (the static rule: 5 of 11) with no false trip on the shipped
    # config; the hardware flights' margin to it was 5.8-7.7 deg (0.2 s nearly false-tripped flight 2).
    push_pull_guard_q3_rate_min_deg_s: 30.0
    push_pull_guard_q2_max_deg: 45.0
    # THE SWAY GUARD (2026-10-30, archive/valve_safety_fixes_20261030 after the 10-29 crash): the
    # clamped contact's growing whirl, caught by the RATE of the horizontal CoM error (x_c - x_cd,
    # the law's own debug), low-passed 0.25 s, above 0.15 m/s for 0.2 s with the claw on the fin
    # -> this file's abort, but with the claw handed to the CoM at once (a base running away must
    # not stretch the arm through a room-held release). Replayed (tools/sway_metric_replay.py):
    # 0 of 56 completed Isaac turns trip (their worst 132 mm/s), the 10-29 collapse trips 3.0 s
    # before the q3 rate guard (5.7 s after the grasp), 10-28 flight 1 6.9 s after the grasp. The
    # CoM error itself is NOT the metric: a 60 mm limit tripped 37 of 56 completed Isaac turns.
    push_pull_guard_sway_speed: 0.15
    push_pull_guard_sway_filter_s: 0.25
    push_pull_guard_sway_persist_s: 0.20
    # THE FIN IN THE U (2026-11-03, user: "what if the fin goes out of the U during the turn?"; Pegasus
    # archive/valve_upush_20261102 section 9): losing the fin is harmless -- the turn carrying on while
    # the valve stays put is not (Isaac f0: the landing gear flew into the fin). On every valve mocap
    # sample from Ready's end through the turn, the fin's place relative to the claw (the fin from the
    # mocap, the claw from the joints + odometry + attitude) aborts AT ONCE (0.02 s) when it is out of
    # the U. Limits just outside every completed Isaac turn (tools/fin_monitor_replay.py, 24 runs):
    # the claw's depth under the fin top >= 71 mm in them (the shallow grasps that could not push:
    # <= 27); the fin across the claw <= 22.6 mm; the fin behind the bracket <= 6 mm (f0, lost: 173);
    # ahead of it <= 47 mm (the slack at the turn's start, a drifting vehicle catching up; k3: 69).
    push_pull_guard_fin_depth_min: 0.012  
    push_pull_guard_fin_across_max: 0.035  
    push_pull_guard_fin_behind_max: 0.015
    push_pull_guard_fin_ahead_max: 0.060
    push_pull_guard_fin_bracket_back: -0.0169  
    push_pull_guard_fin_persist_s: 0.02
    # ... and the arm folding onto its upper stop on the fin (the forced JAM: the fin stays in the U, the
    # vehicle presses on it, q3 32 -> 50 deg in 1.2 s; completed turns q3 <= 34.7)
    push_pull_guard_fin_q3_max_deg: 40.0
    push_pull_valve_fin: [0.1600, -0.0219, 0.2040, 0.0790, 0.0025, 0.0600]  
    # THE CLEARANCE GUARD (2026-11-03): whatever the cause, the skids, struts, rotor discs and arm links
    # (not the gripper) against the fin, beam and hub (15 mm) and the marker balls (5 mm), 0.02 s.
    # Completed Isaac turns (tools/clearance_replay.py): boxes >= 25 mm (the forearm by the fin); balls
    # 10-22 mm -- the LEFT SKID's front end passes over the tallest ball (#2, by the hub, its top 140 mm
    # above the plate) mid-turn, as the vehicle runs ahead of its circle; two drift runs BRUSHED it
    # (m3_final_drift3, k3: Isaac's contact report). The real T650's gear sits 5.5 mm deeper: lower that
    # ball (the others top out <= 107 mm) to give this guard room.
    push_pull_guard_clearance: 0.015
    push_pull_guard_clearance_marker: 0.005
    push_pull_guard_clearance_persist_s: 0.02
    push_pull_guard_clearance_range: 0.8
    push_pull_valve_beam: [-0.0250, 0.2001, 0.0250, 0.0540, 0.0140]
    push_pull_valve_hub: [0.0250, 0.0540]
    push_pull_valve_markers: [0.00494, 0.01504, 0.09249, 0.04006, -0.01983, 0.12549, 0.10483, 0.04341, 0.07049, 0.12515, -0.04252, 0.06849, 0.19245, 0.01072, 0.09249]
    push_pull_valve_marker_radius: 0.015
    # THE PRE-GRASP ROOM HOLD (2026-10-31, archive/valve_room_hold_guards_20261031 after the 10-31
    # evening hardware flight): with the claw room-held above the handle the base drifted 54 mm in
    # the 1.2 s hold, Ready started 67 mm off at 116 mm/s, and the arm absorbed it until q3 went
    # through 0 on the descent -- no guard was armed before the claw reached the handle.
    #   ready gate: Ready waits until the law's horizontal CoM error < 30 mm and its rate < 60 mm/s
    #     for 0.3 s (at Ready: 197 Isaac runs <= 25 mm / 51 mm/s, hardware 14-35 mm / 6-59 mm/s).
    #   leash: in the hold, a CoM error > 40 mm hands the claw back to the CoM anchor (no abort);
    #     the room hold re-engages once the base settles, Ready then waits 1.0 s for the blend
    #     (holds: Isaac <= 31 mm, hardware 20-48 mm).
    #   descent guard: a CoM error > 60 mm on the room-held Ready descent aborts, letting go of the
    #     room hold (descents: Isaac <= 37 mm, hardware 28-74 mm, the 10-31 evening 189 mm).
    #   the q3 guards and the sway guard armed from the room hold on (replayed: the 10-31 evening
    #     trips 0.8 s before the operator; no earlier pre-grasp phase trips).
    # 2026-11-02: OFF with the room-held descent they guarded (the box's approach above):
    push_pull_ready_max_com_err: 0.0
    push_pull_ready_max_com_speed: 0.0
    push_pull_ready_com_settle_s: 0.3
    push_pull_room_hold_leash: 0.0
    push_pull_room_hold_reengage_s: 1.0
    push_pull_guard_ready_com_err: 0.0
    push_pull_guard_arm_before_handle: false
    # VALVE-ONLY PLANNER OPTIONS (2026-11-02, default off -- the box push never sets them):
    #   fast_hand_back: the q3 / sway guard aborts hand the claw to the vehicle through the
    #     node's set_ee_anchor_com_fast (wb_ee_anchor_fast_blend_s 0.25 s; 2026-11-01)
    #   (the STATIC HOLD and its grasp event, push_pull_grasp_event, were REMOVED on 2026-11-02,
    #   user: "it is dangerous" -- the contact phase comes on only with the Turn)
    push_pull_fast_hand_back: true
    # THE ROTOR SAMPLE GATE (the box push's, 2026-10-21): an obj_0 sample farther than 20 mm /
    # 10 deg from the last good one (the allowance growing with the gap) is dropped before Get
    # and the guards read it; Get refuses a window with any dropped sample. The turn's own yaw
    # rate (25 deg/s peak, 0.2 deg per 120 Hz sample) is far inside it.
    push_pull_box_gate_jump_m: 0.020
    push_pull_box_gate_jump_deg: 10.0
    # THE RAW-MOCAP GUARD (the box push's, 2026-10-21, archive/mocap_safety_guard_20261021):
    # the estimator's guard health. A confirmed DRONE mocap fault with the claw on the fin (a
    # LOST one in any step) aborts -- this file's free-handle abort -- and every step and Plan
    # wait for the mocap. The valve-turning stacks launch the estimator with mocap_guard:=true.
    push_pull_mocap_guard_topic: "state_estimator/mocap_guard"
