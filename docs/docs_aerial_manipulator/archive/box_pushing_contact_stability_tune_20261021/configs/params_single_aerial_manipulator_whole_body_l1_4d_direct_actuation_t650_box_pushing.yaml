# ============================================================================
# AM-T650 WHOLE-BODY L1 DIRECT ACTUATION --
# autopilot_whole_body_l1_direct_actuation_node
#
# Created 2026-09-11 (user request) as the hardware twin of
# params_single_aerial_manipulator_whole_body_l1_direct_actuation_t650_sim.yaml,
# in parallel to the GMO hardware file it is derived from
# (params_single_aerial_manipulator_whole_body_direct_actuation_t650.yaml).
# Launch with
#   scripts/indoor_exp/start_whole_body_l1_direct_actuation_stack_t650_aerial_manipulator.sh
# which greps this file for the sim-only values and REFUSES to start if any
# survive. DO NOT fly this file in simulation, and never fly the _sim one here.
#
# !!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!
# !! NOMINAL PLANT ONLY. NO INJECTIONS, EVER, IN THIS FILE.                 !!
# !!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!
# Standing rule for every EXPERIMENT config (user, 2026-09-11): no deliberate
# disturbance, mismatch or uncertainty of any kind. Concretely, and these are
# exactly what the launcher's gate greps for:
#   NO alloc_thrust_coeff above the bench calibration (no +15% / +17.6% kf)
#   !! BROKEN 2026-09-12, deliberately, by user request: alloc_thrust_coeff is
#      4.260431e-05, the bench kf understated 6.2%. See the key's own note.
#      This file is NOT the nominal plant until that is restored. !!
#   NO sim_plant_mass_scale / sim_plant_inertia_scale
#   NO sim_plant_com_shift_*      NO sim_arm_* servo distortion
#   NO ude_height_threshold lowered to cover an injected mass error
# On hardware the plant IS the real vehicle, with its own real and unknown
# errors; a synthetic one compounds them rather than emulating them, and it
# quietly changes loop gain (a believed-high kf commands less motor per unit
# torque -- which is how the +15% injection once MASKED a bad M_r_d instead of
# testing it). Stress injections belong in the _sim twin, where the plant is
# known exactly and the mismatch is the experiment.
#
# HOW THIS FILE WAS BUILT, exactly, so it can be re-derived:
#   PLANT + ALLOCATOR + SAFETY MAP  = the GMO HARDWARE file, verbatim. Bench kf
#     4.540431e-05, bench km +-0.018164, thrust pair 0.036758 / 0.241528
#     (re-derived at bench kf and this mass), mass 3.746170, the measured
#     wb_base_com_y -0.017854, the arm sign map and the arm topics.
#   LAW + OBSERVER                  = the L1 _sim file, verbatim. k_x 32 /
#     k_v 20, K_y 20 / D_y 12 with psi 0.3, NO joint-posture PID, the CoM-anchor
#     and u3 internal feedforward pair, and the whole wb_l1_* block.
#   SIM-ONLY KEYS                   = dropped. No sim_plant_*, no sim_arm_*, no
#     kf injection: hardware has its own real, unknown kf error, and injecting a
#     synthetic one compounds it rather than emulating it.
#
# THE POSTURE TERM IS ABSENT ON PURPOSE, AND THAT IS ONLY SAFE AS A SET. The GMO
# files carry wb_posture_* and a DO-NOT-DELETE note, because removing the term
# alone made DIRECT diverge (2026-09-05: 1 of 3 matched-kf soaks survived). The
# L1 path replaces it with the pair below, flown 3/3 with 0.00% joint clamp on
# 2026-09-09:
#     wb_ee_anchor_com: true      free-flight EE reference held about the ACTUAL
#                                 CoM, so the entry transient cannot drag the
#                                 world-locked EE task out of the workspace
#     wb_u3_internal_ff: true     the arm channel's own disturbance cancellation
#   + wb_ky_* 20 / wb_dy_* 12     the stiffer task those two make admissible
# Never carry ONE of these into a file without the others, and never set the
# posture gains here expecting the sim numbers to still apply.
# wb_u3_internal_ff REQUIRES an attributing observer (wb_l1_observer_type: l1
# with wb_l1_decompose: true, both below). On the GMO path the same key would
# inject the lumped estimate twice. Command.md 7.15.7.
#
# !!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!
# !! THE MASS IS NOT A FREE PARAMETER ON THIS NODE.                         !!
# !!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!
# The whole-body law carries its own MODEL (link masses, inertias, geometry in
# WholeBodyParams::t650Defaults, locked by the wb_parity gtest) and the node
# cross-checks that model's total (3.746174 kg) against vehicle_mass at startup,
# THROWING past 0.5% (+-18.7 g). Weighing the vehicle and editing vehicle_mass
# alone will either land inside 19 g or stop the node from starting; past that,
# t650Defaults' base mass must move with it and the package be rebuilt. Do not
# widen the gate -- the law's gravity, inertia and observer terms all read that
# model. thrust_scaling / idle_thrust are the SAFETY tangent linearization and
# must be RE-DERIVED whenever mass OR kf moves (derivation and a table of
# re-derived pairs: the GMO hardware file's header).
#
# STATUS: NEVER FLOWN, IN THIS FORM OR ANY OTHER -- the whole-body law is
# unflown on hardware on every airframe, and geometric+L1 is unflown on
# hardware too. Sim status of this exact law/observer/guard combination:
# 2026-09-09's 3/3 full-mission flights (posture off, compensation on) and
# 2026-09-11's guard validation (full 10-leg mission with no false trip, peak
# CoM error 410 mm against the 750 mm limit; forced trips of both the tilt and
# the drift guard). All of that is SIMULATION.
#
# ─── OPEN HARDWARE ISSUE, READ BEFORE THE FIRST FLIGHT ───────────────────────
# wb_arm_reference_topic below is carried over from the GMO hardware file and
# points at .../external_torque_controller/reference_joint_trajectory. On
# HARDWARE nothing publishes that in SAFETY: the 2026-09-05 arm-reference split
# moved reference generation into fsc_open_manipulator's arm_planner node, and
# the hardware arm launch (external_torque_hardware.launch.py) does not start
# it -- the controller keeps its own generator and publishes
# ~/smoothed_reference_joint_trajectory instead. The DIRECT-entry gate checks
# this topic's freshness, so as written DIRECT entry should be REFUSED on
# hardware ("arm reference stale"). Resolve before flying, by either
#   (a) running arm_planner alongside the hardware arm stack (set
#       external_reference_topic in external_torque_controller_hardware_aerial_pwm.yaml
#       -- the sim topology, which also gives the SAFETY-guard arm fold), or
#   (b) pointing this key at the controller's own smoothed reference.
# This file does not choose for you; it is a sim-validated config, not a
# hardware-validated one. Sim status of (a): 2026-09-11, 3 flights.
#
# ─── SAFETY GUARD (2026-09-11, user request) ─────────────────────────────────
# Every exit from whole-body DIRECT -- the tilt watchdog, the body-rate
# watchdog, the sideways-drift watchdog, the feedback-loss failsafe, the drone
# ground station's "Return to baseline" and set_direct_mode false -- lands in
# the same state: SAFETY (PX4 attitude+rate+mixer), the position reference
# re-seeded to WHERE THE VEHICLE IS at that instant so it hovers there, and
# then the arm folded back to home. The arm half is system_arm_go_home_service
# below, fired system_arm_go_home_delay_s after the revert so the vehicle is
# hovering before the arm moves; it needs whatever node advertises go_home on
# the arm side (see the open issue above). A watchdog trip LATCHES: only a
# deliberate set_direct_mode true re-arms it, and the entry gates still apply.
#
# WHAT TO WATCH -- wb_control_debug is 89 elements on this node ([0..56] are
# the GMO layout, [57..88] the L1 observer's; [57] = 1 means L1 owns the tick,
# and a MISSING magenta "DISTURBANCE OBSERVER: L1 ADAPTIVE" startup banner
# means the GMO is flying instead).
#   [ 4]     arm state fresh -- 0 IN DIRECT MEANS THE LAW IS HOLDING LAST
#            COMMANDS
#   [13..16] published joint torques [N.m]; ~[0, 0.52, 0.42, 0] at home. The
#            3.0 clamp is always wrong.
#   [17]     u1 collective [N] -- ~36.7 N at this mass and the BENCH kf. A
#            persistent offset is a wrong thrust map or a wrong mass.
#   [41..44] motor commands. Expect a FRONT/REAR SPLIT of ~+-0.029 about a
#            ~0.579 mean (the front pair carries the arm's moment), i.e. about
#            0.61 / 0.55. FOUR SYMMETRIC COMMANDS NEAR 0.50 MEANS A BARE-T650
#            YAML GOT LOADED -- land it.
#   [51]     n_sat -- allocator saturation count, want 0.
#   [56]     streamed-reference fresh (1 = the whole-body planner drives).
# Confirm identity at startup: vehicle_info info[0] must read AM-T650-WB-L1-HW.
# "AM-T650-WB-L1" without -HW is the SIM file; "AM-T650-WB-HW" is the GMO one.
# ─────────────────────────────────────────────────────────────────────────────

/**/fsc_autopilot_ros2:
  ros__parameters:
    system_posctl_type: robust_controller
    system_posctl_rate: 100.0
    # Inner loop: whole-body law + allocation in DIRECT, arm hold in SAFETY.
    system_attctl_rate: 250.0
    system_ude_type: velocity_based

    # ─── DIRECT-mode fallback watchdog (SAFETY GUARD) ─────────────────────
    # Tilt is acos(R22), the body z axis off vertical, which is always
    # >= max(|roll|, |pitch|): the limit trips on EITHER, on a single sample.
    # 2026-10-05 (user request, before the figure-8 flights): 15 deg, the same
    # number on the whole-body and the decoupled (geometric L1) rig. Was 20.
    # Nominal peaks: hardware DIRECT 2.1-5.3 deg (0918-0929), sim figure-8 2.6
    # deg, sim DIRECT entry transient 6-10 deg; every divergence recorded on
    # this rig went past 20 on its way out.
    system_wd_max_tilt_deg: 15.0   # previous: 20.0
    system_wd_max_rate_dps: 360.0
    # SIDEWAYS DRIFT: the HORIZONTAL CoM tracking error |x_c - x_cd|_xy,
    # measured against the reference the law is actually flying, so a planned
    # base step never counts -- only the law losing the vehicle does. Sim
    # peaks: 410 mm at the DIRECT entry, 349 mm on the step/trajectory legs.
    system_wd_max_drift_m: 0.75
    # Position-feedback loss failsafe -- identical mechanism to the sibling
    # nodes. Set fb_timeout_s: 0.0 to disable.
    system_fb_timeout_s: 1.0
    system_fb_land_speed: 0.2
    system_mocap_guard_topic: "state_estimator/mocap_guard"  # BOX-PUSHING ADDITION -- make_push_pull_yaml.py
    # SAFETY-GUARD ARM FOLD. Relative to this node's namespace, so it resolves
    # to /<uav_prefix>/fsc_open_manipulator/external_torque_controller/go_home.
    # Empty disables it. On hardware the arm's own min-jerk generator owns the
    # motion (max_velocity 0.2 rad/s, min 1.5 s, in the arm yaml); in the Isaac
    # rig arm_planner handles this same mode edge instead and this key is left
    # empty there, so the arm is never commanded by both.
    system_arm_go_home_service: "fsc_open_manipulator/external_torque_controller/go_home"
    system_arm_go_home_delay_s: 2.0  # HARDWARE BOX PUSHING: the arm GS opens the jaws on a SAFETY revert; the real gripper needs ~0.7 s -- fold after it (free flight 1.0)

    # ─── VEHICLE (SAFETY thrust map + the one mass the stack flies) ────────
    # vehicle_mass is the AS-FLOWN total (airframe + arm + battery + mounting +
    # cabling). 3.746170 is the SIM PLANT's total, carried over and NOT
    # CONFIRMED ON A SCALE -- read the mass warning in the header first.
    vehicle_name: "AM-T650-WB-L1-4D-HW-PUSH"
    # RE-DERIVED AT THE BENCH kf 4.540431e-05: T_hover/rotor 9.1875 N -> omega
    # 449.831 rad/s -> u_hover 0.5792. The _sim file's pair, computed at the
    # simulator's own kf, is 0.038962 / 0.261777 (u_hover 0.6197) and must never
    # be flown here. Identical to the GMO hardware file's pair -- same mass,
    # same bench kf, same derivation, as it must be.
    vehicle_thrust_scaling: 0.036758
    vehicle_idle_thrust: 0.241528
    vehicle_num_rotors: 4
    vehicle_mass: 3.746170

    # ─── SAFETY position loop (robust_controller) — the AM-T650 tune ───────
    posctl_pid_form: "nested"
    posctl_apply_pos_err_saturation: true
    posctl_apply_vel_err_saturation: true
    posctl_k_pos_x: 0.45
    posctl_k_pos_y: 0.45
    posctl_k_pos_z: 1.0
    posctl_k_vel_x: 7.0
    posctl_k_vel_y: 7.0
    posctl_k_vel_z: 7.0
    ude_gain: 0.45
    # 0.4 m, the GMO hardware value -- NOT the _sim file's 0.35. The sim needs
    # the lower gate only because sim_plant_mass_scale 1.10 leaves its gravity
    # feedforward 3.67 N short, so the UDE has to be live before the vehicle
    # can leave the 0.305 m resting height. Here the mass is honest.
    ude_height_threshold: 0.4
    ude_disturbance_lbx: -10.0
    ude_disturbance_lby: -10.0
    ude_disturbance_lbz: -10.0
    ude_disturbance_ubx: 10.0
    ude_disturbance_uby: 10.0
    ude_disturbance_ubz: 10.0

    # ─── WHOLE-BODY LAW (wb_*) — control_params.py schema ─────────────────
    # ENTRY-TRANSIENT TUNE (2026-09-09, sim): k_x 16 -> 32, k_v 12 -> 20 cut the
    # peak base error at the SAFETY->DIRECT switch from 919 to 411 mm and the
    # recovery from 12.4 to 6.4 s. wn 2.07 -> 2.92 rad/s, zeta 0.78 -> 0.91,
    # still far below the 10.03 rad/s rotor-lag pole. The GMO files keep 16/12.
    wb_k_x: 50.03  # 2026-09-27 circle tune; was 32.0 (H1b, circle_tune_20260927)
    wb_k_v: 12.58  # 2026-09-27 circle tune; was 20.0 (H1b, circle_tune_20260927)
    # ATTITUDE PAIR + M_r_d: the 2026-08-22/23 retune, unchanged. 4.0/1.5 rode
    # wn 6.9 rad/s against the 10.0 rad/s rotor-lag pole plus the DDS transport
    # latency and tripped the rate watchdog 20 s after entry; 2.0/1.1 halves the
    # bandwidth. M_r_d is 1.5x the T650 I0 diagonal -- I0 alone is BODY-ONLY
    # inertia while the coupled value with the arm is ~[0.132, 0.112, 0.116], so
    # the old setting asked the vehicle to rotate as if it were half its real
    # weight. Screened for DELAY MARGIN (wb_hover_stability.py: 24 ms at 1.0x,
    # 32 ms across a 1.5-2.0x plateau) and then flown. Raising k_R or k_w does
    # NOT help -- k_w makes it worse.
    wb_k_r: 1.6  # BOX-PUSHING OVERRIDE -- make_push_pull_yaml.py
    # 2026-09-27: k_w 1.5 -> 0.9 (sim2real_tuning_20260926, Command.md 7.17.14).
    # The circle's base error is a BODY-FIXED lateral force rotating in world at
    # the heading rate; f_d_dot has no d_hat rate, so omega_0c carries a spurious
    # roll/pitch rate and the attitude parks at e_R ~ (k_w/k_R) e_w. Lower k_w =
    # smaller e_R AND more delay margin (1.5 aborts at 24 ms offline, 0.9 survives
    # 28). Isaac, 0924 F2 circle: flight-matched plant 83.3 -> 63.5 mm EE abs,
    # robustness plant 86.5 -> 68.0 mm, |e_R| 0.10 -> 0.06; cost = larger
    # robustness DIRECT-entry handover 360 -> 427 mm. zeta 1.47 -> 0.88.
    # Previous value: 1.5. NOT flown on hardware yet.
    # SUPERSEDED the same day by the joint circle tune H1b (k_w 1.567 below,
    # with k_x/k_v/k_R/M_r_d/K_y/D_y/L1 moved together -- circle_tune_20260927,
    # Command.md 7.17.16). Do not revert k_w alone.
    wb_k_w: 1.2  # BOX-PUSHING OVERRIDE -- make_push_pull_yaml.py
    # 2026-09-26: x M_r(joint-diagonal armature)/M_r(link armature) at home
    # [0.116522, 0.136107, 0.125102] -> below, so the attitude loop's gain
    # M_r M_r_d^-1 k_R is EXACTLY the flown one under the new armature model
    # (wb_armature_joint_diag moves M_r by +12 / -0.1 / +7 %). Revert both
    # together.
    wb_mrd_x: 0.139992  # 2026-09-27 circle tune; was 0.130710 (H1b, circle_tune_20260927)
    wb_mrd_y: 0.145617  # 2026-09-27 circle tune; was 0.135962 (H1b, circle_tune_20260927)
    wb_mrd_z: 0.143795  # 2026-09-27 circle tune; was 0.134261 (H1b, circle_tune_20260927)
    # EE IMPEDANCE -- the stiff pair that replaces the posture PID (header).
    # K_y 2 / D_y 4 belongs with the posture term; carrying that softer pair
    # here would leave the arm with no branch selection at all.
    # 2026-09-26: K_y/D_y 20/12 -> 80/24, tuned AFTER the armature structure
    # and the observer velocity were fixed (both above). Offline arm sim (exact
    # law, stick-slip friction, bench-measured arm, the real 20 Hz observer on
    # quantised encoder positions): j2/j3 0.9/1.9 deg rms vs 5.4/8.9 as flown,
    # stable with +-30 % armature and 40 ms of extra arm transport on a
    # coupled arm; K_y 120 fails that last case, and every K_y >= 80 limit-
    # cycles on Present Velocity. bench/tune/ in the armature campaign.
    wb_ky_x: 120.0  # BOX-PUSHING OVERRIDE -- make_push_pull_yaml.py
    wb_ky_y: 120.0  # BOX-PUSHING OVERRIDE -- make_push_pull_yaml.py
    wb_ky_z: 120.0  # BOX-PUSHING OVERRIDE -- make_push_pull_yaml.py
    # Heading channel at 0.3: at 1.0 the (q1,q4) pair self-excites a 3.90 Hz
    # ripple that drove q4 across its entire +-3.0 N.m clamp on the trajectory
    # legs (2026-09-06). Heading tracking IMPROVED at 0.3.
    # 2026-10-16: 0.2484 / 0.2903 -> 2.5 / 0.93 (with wb_l1_stuck_hold_j4
    # below; the pair is the fix, neither works alone). Through the exact law
    # the heading row lands on the wrist roll q4 almost alone, K_q = 0.178 K_psi
    # and D_q = 0.178 D_psi at every arm pose, so q4's stiffness goes 0.043 ->
    # 0.434 N.m/rad (q1 unchanged, 4.33 N.m/rad from the position rows). At
    # 0.043 the spring could not restart the wrist anywhere within ~+-35 deg
    # against j4's 0.035-0.045 N.m static friction: it parked where it
    # stopped and the observer wound it free (10-16 empty flight: +-16..25 deg
    # every ~10.5 s). Offline (j4 model validated on the 10-15/10-16 wrist
    # failures + the 09-27 exact-law circle bench): no stick-slip in any of
    # 15 robustness variations, parks within 0.6-2.2 deg, roll tracking lag
    # 8.9 -> 0.7 deg, wrist delay margin 76 ms, and the vehicle's circle
    # tracking, gust response and 28 ms delay margin unchanged to the decimal.
    # The 2026-09-06 3.90 Hz heading ripple came through the 6-D path's F_hat_y;
    # on the 4-D path F_hat_y is zero in free flight (only push-and-pull sets
    # the contact flag). archive/j4_heading_stuck_20261016/.
    wb_ky_psi: 0.2484  # BOX-PUSHING OVERRIDE -- make_push_pull_yaml.py
    wb_dy_x: 20.2  # BOX-PUSHING OVERRIDE -- make_push_pull_yaml.py
    wb_dy_y: 20.2  # BOX-PUSHING OVERRIDE -- make_push_pull_yaml.py
    wb_dy_z: 20.2  # BOX-PUSHING OVERRIDE -- make_push_pull_yaml.py
    wb_dy_psi: 0.2903  # BOX-PUSHING OVERRIDE -- make_push_pull_yaml.py
    wb_my_x: 1.0
    wb_my_y: 1.0
    wb_my_z: 1.0
    wb_my_psi: 0.05
    wb_impedance_shaped: true
    wb_dls_lambda: 0.3
    wb_attitude_from_odometry: false  # BOX-PUSHING ADDITION -- make_push_pull_yaml.py
    wb_attitude_odometry_correction_rad_s: 0.0  # BOX-PUSHING ADDITION -- make_push_pull_yaml.py
    # ONE clamp number across the whole chain: this == the
    # ExternalTorqueController's max_effort == the arm driver's own limit.
    wb_tau_max: 3.0
    wb_omega_e_ff: false
    wb_gmo_use_achieved: false

    # ─── DISTURBANCE OBSERVER: L1 ADAPTIVE (not the GMO) ──────────────────
    # wb_use_gmo gates the estimator as a whole; wb_l1_observer_type selects
    # WHICH one runs, and the ko_* below are the GMO's gains, inert here but
    # kept so a fallback to "gmo" is one key away and still the flown tune.
    wb_use_gmo: true
    wb_ko_t: 0.5
    wb_ko_r: 0.1
    wb_ko_q: 0.1
    wb_l1_observer_type: "l1"
    # Deadbeat piecewise-constant inversion, then C(s) = omega_c/(s+omega_c).
    # A_s is inert at one-tick adaptation (adapt_period 0) in noise-free
    # conditions; omega_c alone sets robustness.
    wb_l1_a_t: 2.0
    wb_l1_a_r: 2.0
    wb_l1_a_q: 2.0
    wb_l1_adapt_period_s: 0.0
    # omega_c: translational 2.0, ROTATIONAL 0.5, arm 0.5. The rotational
    # channel is the one that binds -- 1.5 degraded badly and 3.0 aborted in
    # 12 s (2026-09-06). Do not raise it.
    wb_l1_omega_c_t: 1.0  # BOX-PUSHING OVERRIDE -- make_push_pull_yaml.py
    wb_l1_omega_c_r: 0.7428  # 2026-09-27 circle tune; was 0.5 (H1b, circle_tune_20260927)
    wb_l1_omega_c_q: 0.8479  # 2026-09-27 circle tune; was 0.5 (H1b, circle_tune_20260927)
    wb_l1_omega_i: 2.0
    # 4-D: C_x IS u3's feedforward filter (see the block below), so this is
    # no longer only a wrench-reading smoother. The 6-D rig's 20 rad/s would
    # hand u3 a nearly raw 250 Hz momentum difference. SET BY THE 2026-09-16/17
    # SWEEP (Command.md 7.17.3), 10 flights, none aborted: 6 -> 339 mN.m of
    # j2 torque ripple at the airframe's 0.94 Hz attitude mode and 14 deg
    # tilt p-p; 2 -> 259; 0.5 -> 196; 0.25 -> 5.0 mN.m, BELOW both 6-D
    # baselines (7.8 / 70), with the best CoM, EE and tilt numbers of the
    # campaign, repeated 3/3. The boundary is between 0.25 and 0.5 and it is
    # the TRANSLATIONAL block of the feedforward that excites the mode (the
    # per-block keys below measured it); what the 6-D design had and this one
    # removes on purpose is the rendered -(Lam M_y^-1 - I) F_hat_y, a ~0.4 N
    # force off a 20 rad/s filter acting as fast momentum feedback into u3.
    # Do not raise this without re-flying the ripple table.
    wb_l1_omega_x: 2.0  # BOX-PUSHING OVERRIDE -- make_push_pull_yaml.py
    # L_c metric: the note's minimum-norm choice (all 1.0) compares newtons with
    # newton-metres and books a thrust deficit as joint torque. This prior
    # variance is what makes the attribution work -- measured phantom EE force
    # 0.055 N against the GMO's 1.884 N.
    wb_l1_lc_var_f: 100.0
    wb_l1_lc_var_m: 0.25
    # NOT exercised by any flown campaign: every flight had an ideal arm
    # (sim_arm_backemf_enable false). RAISE IT once the arm's real current-loop
    # residual is in the loop.
    wb_l1_lc_var_q: 0.0025
    # Required by wb_u3_internal_ff (header): it is the attribution.
    wb_l1_decompose: true

    # ── FOUR-DIMENSIONAL ATTRIBUTION (2026-09-16) ─────────────────────────
    # The note's September revision: attribute on the JOINT ROWS.
    #   [w_Sigma]_q = w_q + J_yq^T F   (a platform wrench has [w]_q = 0 EXACTLY)
    #   w_hat_q  <- low-pass omega_q of [w_hat_Sigma]_q, FREE FLIGHT ONLY
    #   F_hat     = J_yq^-T ([w_hat_Sigma]_q - w_hat_q)
    #   F_hat_y   = (1 - chi) C_x F_hat            -> 0 in free flight
    #   d_int^f   = C_x T^-T (w_hat_Sigma - (1 - chi) T^T J_y^T F_hat) -> u3
    # With this true, wb_l1_decompose / omega_i / lc_var_* above are unused;
    # wb_l1_omega_x is C_x on both outputs. Identifiable at every instant, no
    # metric, no excitation condition; the cost is that the four joint rows
    # must be KNOWN (trimmed in free flight, frozen in contact) and the phase
    # flag is the task's, with a threshold fallback for a collision.
    wb_l1_four_d: true
    # Trim bandwidth [rad/s]. LOW on purpose (Prop. wq4: error
    # ||T|| eps_1 + L_q/omega_q; a fast trim would absorb a slowly applied
    # contact below the collision threshold as friction). It never affects
    # free-flight motion -- only how fast the RAW F_hat reading goes to zero.
    wb_l1_omega_q: 0.2
    # The task's phase flag: false = free flight (F_hat_y == 0), true = an
    # interaction phase is commanded (trim frozen, F_hat_y rendered). This
    # file is free flight only; flip it only for a commanded interaction phase.
    wb_l1_contact: false
    # Collision fallback [N] on the filtered |F_hat| force rows (hysteresis,
    # releases at 70 %); 0 = off. Off here, as in the sim campaign, so the
    # flag cannot flip on the DIRECT-entry transient.
    wb_l1_collision_threshold_n: 0.0
    wb_l1_contact_hold_translation: false  # BOX-PUSHING ADDITION -- make_push_pull_yaml.py
    # PER-BLOCK C_x on u3's feedforward d_int^f (2026-09-17). The note's C_x
    # is one scalar; flown that way it has to serve the translational block
    # (the 6-D path filtered it at omega_c_t = 2) and the rotational/arm
    # blocks (0.5) with one number, and measured: 2.0 triples the j2/j3
    # torque ripple at the 0.94 Hz attitude mode, 0.5 still doubles it.
    # These give d_int^f's three blocks their own bandwidth, the same
    # blkdiag structure C(s) already has one layer up; 0 = use wb_l1_omega_x
    # (the scalar form). F_hat^f, the wrench READING, keeps the scalar.
    wb_l1_omega_x_t: 0.1  # BOX-PUSHING OVERRIDE -- make_push_pull_yaml.py
    wb_l1_omega_x_r: 0.1  # BOX-PUSHING OVERRIDE -- make_push_pull_yaml.py
    wb_l1_omega_x_q: 0.1  # BOX-PUSHING OVERRIDE -- make_push_pull_yaml.py
    # While j4's q_dot, low-passed at 0.25 s, is below 0.02 rad/s, its rows
    # of the observer's filters (the Layer-2 d_f and u3's d_int^f) hold their
    # state, so the feedforward cannot ramp the wrist's push against static
    # friction until it breaks free and overshoots -- the mechanism of every
    # empty-wrist hunting cycle flown (10-15, 10-16). The deadbeat estimate
    # and the predictor keep running; the rows resume from the held state
    # once the wrist moves. The low-pass rides out the 3-5.5 deg/s velocity
    # spikes one encoder count gives on a joint that is not moving. Needs
    # wb_ky_psi 2.5: alone it would leave the wrist parked wherever it first
    # stopped. j1-j3 stay off: their estimate carries the gravity / payload
    # compensation the flights rely on. wb_control_debug[115] = held joints.
    wb_l1_stuck_hold_j1: false
    wb_l1_stuck_hold_j2: false
    wb_l1_stuck_hold_j3: false
    wb_l1_stuck_hold_j4: false  # BOX-PUSHING OVERRIDE -- make_push_pull_yaml.py
    wb_l1_stuck_speed: 0.02
    wb_l1_stuck_filter_s: 0.25
    wb_l1_max_force_n: 20.0
    wb_l1_max_torque_nm: 2.0
    wb_l1_max_joint_nm: 1.5
    wb_l1_max_wrench_force_n: 15.0
    wb_l1_max_wrench_torque_nm: 3.0

    # ─── THE POSTURE PID'S REPLACEMENT (2026-09-09) ───────────────────────
    # See the header: these two and wb_ky_*/wb_dy_* above are ONE set. The four
    # wb_posture_* keys are deliberately ABSENT, not zeroed -- absent makes the
    # term unreachable from this file, and the node's startup LAW CHECK line
    # prints green to prove it.
    wb_ee_anchor_com: true
    wb_ee_anchor_free_axis_weight: 0.75  # BOX-PUSHING ADDITION -- make_push_pull_yaml.py
    wb_u3_internal_ff: true
    # 4-D: TRUE. With wb_l1_four_d this is the note's d_hat_int^f =
    # C_x T^-T w_hat_int (eq. u3_4), already filtered at wb_l1_omega_x -- the
    # 4-D design's own form. (On the 6-D hardware file false = the filtered
    # LUMPED estimate, measured better there in free flight; true meant the
    # unfiltered Step-2 T^-T w_hat.)
    wb_u3_internal_ff_use_w_hat: true
    # ─── STICTION CAP ON THE OBSERVER-DRIVEN SHARE OF u3 (2026-09-13) ─────
    # Per joint, N.m; 0 = uncapped (byte-identical law). The 2026-09-13
    # props-off ground test (bag noprop_arm_test_022112) showed J4 stick-slip
    # in DIRECT: the estimate on a joint held by stiction converges to minus
    # the applied torque, the feedforward re-applies it, the pair ramps until
    # J4 breaks free at ~0.13 N.m, slips 0.3-0.5 rad through wb_ky_psi 0.3,
    # re-sticks, and the cycle repeats (+-30 deg, ~20 s). Not the L1 law:
    # predictor, adaptation and filter are untouched; only what the estimate
    # may push on the arm is bounded. The cap sits under J4's measured
    # breakaway (0.105-0.13 N.m across four events) and near its kinetic
    # friction (~0.07, where the slips stopped), so the estimate can still
    # cancel gravity/model error on J4 but can never break it free alone.
    # J1-J3 uncapped: their observer share carries the gravity-mismatch
    # cancellation the 2026-09-09 flights relied on. J1 drifted 6.7 deg in
    # the same test through the shared heading channel -- cap it next if it
    # shows the same cycle.
    wb_u3_estimate_max_j1: 0.0
    wb_u3_estimate_max_j2: 0.0
    wb_u3_estimate_max_j3: 0.0
    # 2026-10-16: the 10-16 friction re-identification puts j4's static
    # friction at ~0.035-0.045 N.m, so 0.06 is ABOVE breakaway and never bound
    # on the 10-16 flights (the share peaked at 23-50 mN.m). Kept as a
    # backstop; wb_l1_stuck_hold_j4 is what stops the wind-up.
    wb_u3_estimate_max_j4: 0.06
    # The handover seed is a translational-only UDE copy; the L1 campaign flew
    # without it.
    wb_seed_disturbance_from_ude: false

    # ─── BARE-AIRFRAME CoM — the one model number not from the asset ───────
    # Where the BARE airframe's CoM sits relative to the body origin (the
    # geometric rotor centre, i.e. what the allocator references), MODEL frame
    # [m]: model +y is actual +x, the arm side. MEASURED, and not on this law --
    # it comes from the 2026-08-25 AM-T650 geometric+L1 hardware flight, the
    # SAME PLANT: 218 s DIRECT, six arm-static windows, dx_true = -tau_y/T (a
    # ratio invariant to a wrong alloc_thrust_coeff), 14.82 +- 0.75 mm short of
    # the arm model's prediction, and base_com = -0.01482 / 0.83006.
    # THE WHOLE-BODY PLANNER MUST CARRY THE SAME THREE NUMBERS (its base_com
    # parameter, same frame): it builds x_cd from its own copy of the model
    # while the node computes x_c from this one, so a disagreement is a constant
    # CoM error of (m_base/m_total) times the difference -- and now also eats
    # the drift guard's margin. z IS 0 ON PURPOSE: it makes no moment, cannot be
    # measured this way, but it DOES enter M_r, and wb_mrd_* was tuned at z = 0.
    wb_base_com_x: 0.0
    wb_base_com_y: -0.017854
    wb_base_com_z: 0.0

    # ─── Servo armature (2026-09-26) ──────────────────────────────────────
    # Joint-DIAGONAL, at the ground-bench calibration (fsc_PegasusSimulator
    # docs/docs_aerial_manipulator/arm_armature_20260926/bench/README.md: the
    # 2026-09-09/11 PD+ bags, one J 0.0097 in the old structure = these rows).
    # Replaces the 0.020 h h^T on every link, whose j2/j3 block J[[2,1],[1,1]]
    # gave the joint stiffness a 6.6:1 soft direction (94-99 % of the flown
    # j2/j3 error lay on it). The whole-body planner below carries the same.
    wb_armature_joint_diag: true
    wb_armature_j1: 0.010
    wb_armature_j2: 0.0194
    wb_armature_j3: 0.0097
    wb_armature_j4: 0.0097

    # ─── Arm interface + hold + DIRECT-entry gates ────────────────────────
    wb_arm_state_timeout_s: 0.5
    wb_arm_reference_timeout_s: 0.2
    wb_arm_hold_kp: 3.0
    wb_arm_hold_kd: 0.25
    # WHO HOLDS THE ARM IN THE BASELINE MODE: NOT this node. false = stay silent
    # on the arm torque topic unless the coupled law is actually commanding the
    # arm, so in SAFETY the arm is held by ExternalTorqueController's OWN
    # calibrated PD+ (hold_feedforward_mode: gravity, standing error ~0.05 deg).
    # The hold above is a scalar kp 3 with UNCALIBRATED model gravity, and this
    # arm's custom URDF over-predicts j2 gravity by 24%: streaming it would lift
    # j2 ~3.2 deg, past wb_gate_arm_rad, and DIRECT entry would be refused. The
    # two arm laws are mutually exclusive by construction -- whoever streams
    # owns the arm. The _sim file keeps the default true: the Isaac arm
    # controller has no gravity model.
    wb_arm_hold_stream: false
    wb_gate_pos_m: 0.15
    wb_gate_vel_mps: 0.20
    wb_gate_arm_rad: 0.05
    wb_arm_joint_topic: "fsc_open_manipulator/joint_states"
    # The law's JOINT VELOCITY (2026-09-26): the arm controller's 12 ms encoder
    # observer (velocity_observer_topic in its yaml), NOT joint_states' Present
    # Velocity (52 ms late, measured on the bench bags). The damping on a late
    # velocity is what capped the arm gains -- with Present Velocity every
    # K_y >= 80 below limit-cycles in the offline arm sim. Stale -> the law
    # falls back to Present Velocity for that tick (warned; wb_control_debug
    # [106]) and DIRECT entry is refused.
    wb_arm_velocity_topic: "fsc_open_manipulator/external_torque_controller/velocity_observer"
    wb_arm_velocity_timeout_s: 0.05
    # SEE THE OPEN HARDWARE ISSUE IN THE HEADER: on hardware nothing publishes
    # this topic in SAFETY today, and the DIRECT-entry gate checks it.
    wb_arm_reference_topic: "fsc_open_manipulator/external_torque_controller/reference_joint_trajectory"
    wb_arm_torque_topic: "fsc_open_manipulator/external_torque_controller/joint_torque_command"
    # Arm boundary sign map: the REAL arm's topics are URDF/Dynamixel
    # convention -- joint1/joint4 opposite the whole-body model. Applied to
    # joint_states and the reference on ingest, and to the streamed torques on
    # output. The _sim file deliberately omits these (identity = Isaac).
    wb_arm_sign_j1: -1.0
    wb_arm_sign_j2: 1.0
    wb_arm_sign_j3: 1.0
    wb_arm_sign_j4: -1.0

    # ─── WRENCH ALLOCATION (alloc_*) — AM_xfwd geometry, MN4010 motors ─────
    # NO INJECTION HERE. kf and km are both the BENCH calibration of the
    # physical MN_4010-15x5 and they come as a PAIR (km is a c/kf RATIO, so
    # mixing a bench km with a sim kf delivers yaw at a different fraction of
    # command than thrust -- a silent cross-axis asymmetry). The _sim file's
    # pair is kf 4.7544506e-05 with km 0.0612219; neither belongs on this
    # vehicle. The GEOMETRY is the USD asset's, not a measurement off the real
    # frame: all four arms exactly 0.22990663 m. Nothing here is referenced to
    # the real CoM -- the arm's standing moment is carried by the whole-body
    # model's own r_com, not by this table.
    alloc_rotor0_px: 0.22990663
    alloc_rotor0_py: 0.22990663
    alloc_rotor0_km: 0.018164
    alloc_rotor1_px: -0.22990663
    alloc_rotor1_py: -0.22990663
    alloc_rotor1_km: 0.018164
    alloc_rotor2_px: 0.22990663
    alloc_rotor2_py: -0.22990663
    alloc_rotor2_km: -0.018164
    alloc_rotor3_px: -0.22990663
    alloc_rotor3_py: 0.22990663
    alloc_rotor3_km: -0.018164
    # EXPERIMENT VALUE 2026-09-12 (user request, twice, L1 confirmed as the
    # stack flown today): bench 4.540431e-05 -> 4.260431e-05, the kf
    # UNDERSTATED by 6.2%. The allocator therefore commands ~6.6% MORE motor
    # per unit thrust.
    #
    # THIS IS A DELIBERATE MISMATCH AND THE HEADER'S STANDING RULE FORBIDS ONE.
    # It escapes the launcher's gate only because that gate greps for kf values
    # ABOVE bench (the +15% / +17.6% sim injections); this is below. Flagged to
    # the user before it was applied. Consequences to hold in mind:
    #   - The L1 observer's whole purpose is absorbing plant mismatch, so a
    #     synthetic one confounds the first L1 flight's evidence. Do not read a
    #     good hover here as the L1 law coping with the REAL kf error.
    #   - It stacks with vehicle_mass never having been confirmed on a scale.
    # Restore 4.540431e-05 to return this file to the nominal plant.
    alloc_thrust_coeff: 4.260431e-05
    alloc_omega_idle: 64.0603
    alloc_omega_max: 730.0507
    alloc_motor_idle: 0.0
    alloc_motor_max: 1.0

    safety_min_thrust_setpoint: 0.0
    safety_max_thrust_setpoint: 150.0

# ============================================================================
# WHOLE-BODY PLANNER — which planner builds a setpoint-to-setpoint transition
# ============================================================================
# LEGACY SECTION -- was read by whole_body_planner.py (REMOVED 2026-09-14; the
# C++ node reads the whole_body_trajectory_planner section below). Kept so the
# comments' history survives. Was read by (the stack's `whole-body planner` window), not
# by the C++ node.
#
# SIM AND EXPERIMENT PLAN THE SAME WAY (2026-09-17, user request). Both files
# select "bspline"; the `planner` key was the ONLY difference between this file
# and its _sim twin, so a rehearsal now predicts the flight instead of planning
# a different trajectory (the two backends differ by ~2 cm on a typical
# transition -- only straight_line held the end-effector to a straight line).
# The old "never flown, keep straight_line" note is retired: bspline has the
# 2026-09-14 full 7.15.1 sim mission (10/10 legs, no refusal) and planned every
# Go-to-start of the 2026-09-17 EE circle / figure-8 flights. It also enforces
# what straight_line only verified -- and enforces MORE: rotor force and joint
# torque are checked in the bspline path and were NOT in straight_line, so its
# refusals were a superset, not a different opinion.
# straight_line was DELETED the same day (user request): the registry entry,
# the C++ backend, its gtests and its Python source are gone, so "bspline" is
# the only name this key accepts. It was the backend of the 2026-09-12
# hardware flight and the only one that held the end-effector to a straight
# line; recover it from git if a transit ever has to clear something.
/**/whole_body_planner:
  ros__parameters:
    planner: "bspline"

# ---------------------------------------------------------------------------
# whole_body_trajectory_planner (fsc_trajectory_planner, C++/rclcpp, 2026-09-14)
# The planner the stacks launch now. Mirrors the whole_body_planner section
# above key-for-key so the two files stay one description of the run; the
# python planner (removed 2026-09-14) read THAT section; the C++ node reads THIS one.
# ---------------------------------------------------------------------------
/**/whole_body_trajectory_planner:
  ros__parameters:
    vehicle: "t650_aerial_manipulator"
    planner: "bspline"                # the only backend -- SAME AS _sim
    stream_rate: 100.0
    v_max: 0.30                 # peak CoM speed              [m/s]
    a_max: 0.15                 # peak CoM acceleration       [m/s^2]
    w_max: 0.30                 # peak rate, any angle channel [rad/s]
    t_min: 3.0                  # never faster than this      [s]
    dw_max: 0.60                # bspline: peak angular acceleration [rad/s^2]
    t_max: 40.0                 # bspline: refuse rather than crawl   [s]
    tau_joint_max: 3.0          # bspline: MUST equal wb_tau_max above
    rotor_bounds: true          # bspline: rotor bounds via inverse dynamics
    n_check: 101                # diagnostic grid; 0 disables
    home_pose: [0.0, 0.698132, 0.698132, 0.0]
    hold_ee_world: false
    # Servo armature: MUST equal wb_armature_joint_diag / wb_armature_j1..j4
    # (the planner's joint-torque feasibility and reference torques use it).
    armature_joint_diag: true
    armature: [0.010, 0.0194, 0.0097, 0.0097]
    # base_com and arm_joint_sign are passed by the launcher (hardware: the
    # measured wb_base_com_* and [-1, 1, 1, -1]); the yaml keeps the sim values.
    base_com: [0.0, 0.0, 0.0]
    arm_joint_sign: [1.0, 1.0, 1.0, 1.0]

    # --- end-effector trajectory mode (arm GS "EE trajectory" tab) ------
    ee_traj_circle_radius: 0.5      # [m]
    # FIGURE-8 (2026-10-05, Pegasus docs/docs_aerial_manipulator/archive/
    # figure8_compare_20261005): "radius" = the half-length A. FIRST-FLIGHT SETTING
    # A 0.70 / B 0.35 m at a 0.10 m/s mean EE speed (the arm GS's Figure-8 defaults:
    # path 4.2681 m -> a 42.68 s lap, q2 period 10.67 s via ee_traj_q2_cycles_per_lap).
    # Chosen from the conservative sweep: the geometric (decoupled) EE peak scales
    # with the peak YAW RATE, and at 0.10 m/s it is 73 mm in sim (~121 mm predicted
    # in flight, sim/flight 0.6), the 8 + errors fitting a 2 x 2 m square with
    # +110 mm per side. Faster steps flown in sim: 0.15 m/s (geo peak 91 mm),
    # 0.20 m/s (128 mm). The 8 is centred on the EE's HOVER point (the crossing).
    ee_traj_fig8_a: 0.70            # figure-8 half-length along its long axis [m]
    ee_traj_fig8_b: 0.35            # half-width across it [m] (B = A/2)
    # LONG AXIS ON WORLD x (2026-10-05, user request): without this the 8 starts along
    # the nose with its long axis ~45 deg off it (diagonal from a yaw-0 hover). The
    # crossing stays at the hovering EE; go-to-start yaws the drone by at most 45 deg.
    ee_traj_fig8_world_axis: true
    ee_traj_fig8_axis_deg: 0.0      # long-axis azimuth, world frame [deg] (0 = x, 90 = y)
    # 2026-09-28 (user request, the whole-body vs decoupled comparison): 0.13 m/s
    # EXACTLY on the 0.5 m circle = 2 pi 0.5 / 0.13 = 24.1660973 s (was 24.0 =
    # 0.1309 m/s). The arm GS derives its Velocity field from this (path length /
    # lap time, 3 decimals): 24.0 displayed 0.131 and, on selecting Circle, wrote
    # back a 23.98 s lap; this value displays 0.130 and writes itself back
    # unchanged. The run is laps * lap + ramp_time = 28.2 s at time scale 1 (the
    # min-snap ramps add one ramp's duration); the circle itself is 24.2 s.
    # ee_traj_q2_period_s below is tied to it; since 2026-10-05 ee_traj_q2_cycles_per_lap
    # (4) derives it from the lap, so a lap edited from the arm GS keeps whole cycles.
    ee_traj_lap_time: 24.1660973    # one lap at time scale 1 [s]
    ee_traj_laps: 1                 # ONE lap (the flown circle since 2026-09-26)
    ee_traj_ccw: true               # circle turns counter-clockwise
    ee_traj_center_origin: true     # circle centred on the world origin at the EE height
    ee_traj_ramp_time: 4.0          # min-snap ramp-in / ramp-out [s]
    # EE attitude about its heading = the fold q2+q3 at rest. 0 (a level EE) is
    # this arm's wrist singularity -> refused.
    #
    # THE FOLD AND THE q2 CENTRE ARE ONE CHOICE, NOT TWO (2026-09-17, user
    # request "30 + 10 sin", and this is why the fold moved with it). At rest
    # q3 = fold - q2 EXACTLY, so lowering the q2 centre RAISES q3 by the same
    # amount: symmetric margins <=> centre = fold/2. At the old 80 deg fold the
    # planner REFUSES 30 +- 10 (q3 would run to 60 against its +50 stop) and the
    # only admissible centre is exactly 40 -- it says so in 0.1 ms with the
    # admissible range, rather than failing later. 60 / 30 +- 10 puts BOTH
    # joints in [20, 40] deg, 10 deg off the stop; the old 40 +- 8 at fold 80
    # left 2 deg, which is what prompted this.
    # Cost of the lower fold, measured: the EE sits 0.135 m below the base
    # instead of 0.061 (reach 0.264 vs 0.253 m), sigma_nd 0.306 -> 0.258 (still
    # 2.6x the 0.10 keep-out) and peak joint torque 0.76 -> 0.82 N.m. s_max is
    # unchanged -- it is set by the drone yaw rate, which is geometry-free.
    # To restore the flown home fold: 80.0 with centre 40.0 and amp <= 8.
    ee_traj_fold_deg: 55.0
    ee_traj_q2_center_deg: 25.0     # the assigned redundancy DoF: q2 sinusoid
    ee_traj_q2_amp_deg: 15.0
    # Period in PHASE seconds, and it MUST DIVIDE laps * lap_time or the run does
    # not end on the pose it started from (the HOLD join then steps q2/q3). FOUR
    # q2 cycles per run (the 0924 flight-4 design, set on the Orin 2026-09-25 as
    # 6.0 s of a 24.0 s lap): since 2026-09-28 lap_time / 4 = 6.0415243 s of the
    # 24.1660973 s lap -- recompute both if the speed, radius or laps change.
    # Peak joint rate = amp * 2pi * s / period: 15.6 deg/s at s = 1, 17.8 at
    # the circle's s_max, under ee_traj_qdot_max (28.6).
    # Bench-checked with the 2026-09-27 tune (circle_tune_20260927
    # arm_sweep_check.py): EE 13.8 mm mirror / 14.9 robustness, 0 % clamp, peak
    # arm torque 1.28 of 3.0 N.m, delay margin to 28 ms intact.
    ee_traj_q2_period_s: 6.0415243
    # q2 PERIOD TIED TO THE LAP (2026-10-05): > 0 makes the planner use
    # lap_time / cycles and IGNORE ee_traj_q2_period_s, so whatever lap the arm GS
    # writes (circle 24.166 s -> 6.0415 s; figure-8 A 0.70 at 0.10 m/s 42.68 s -> 10.67 s,
    # 8.8 deg/s peak q2 rate at s = 1; A 0.75 at 0.20 m/s 22.865 s -> 5.716 s)
    # stays on whole cycles and the run ends on its start pose. 0 = use the period above.
    ee_traj_q2_cycles_per_lap: 4
    # RATE BOUNDS FOR THE EE RUN ONLY (2026-10-05; > 0 overrides v_max/a_max/w_max for
    # this mode, 0 = inherit). The shared bounds above also size every transition
    # (go-to-start, back-to-origin, GS targets) and would cap the 0.20 m/s figure-8 at
    # s = 0.34. With these: s_max 1.06 (set by v_max 0.30), the circle's s = 1 plan is
    # unchanged (only its s_max rises). Sim-flown 3+3 at s = 1, both rigs, 0 saturation.
    ee_traj_v_max: 0.0              # 0 = v_max (0.30 m/s; figure-8 peak 0.28)
    ee_traj_a_max: 0.40             # CoM acceleration [m/s^2]; figure-8 peak 0.33
    ee_traj_w_max: 1.0              # yaw rate [rad/s]; figure-8 peak 0.90 (51 deg/s)
    ee_traj_qdot_max: 0.5           # [rad/s]
    ee_traj_time_scale: 1.0         # the default request; the GS slider overrides
    ee_traj_start_pos_tol: 0.05     # Start button gate: [m], [deg], [deg]
    ee_traj_start_yaw_tol_deg: 5.0
    ee_traj_start_joint_tol_deg: 5.0

    # --- pick-and-place mode (arm GS "Pick & Place" tab), 2026-10-03 -------
    # THE TASK, IDENTICAL ON HARDWARE AND IN SIMULATION (this block is in the
    # hardware file and, verbatim, in section 2 of the mirror ..._sim.yaml).
    # Without it the planner flies its built-in defaults -- pick / place arm
    # pose [0, 0, 0, 0], carry = the folded home pose, every yaw 0 (no turns).
    # The decoupled stacks read their planner section from this file too.
    # Record: Pegasus docs/docs_aerial_manipulator/archive/pick_place_controllers_20261003/.
    #
    # Drone points [x, y, z, yaw_deg] (world, ACTUAL yaw) -- the sim field's
    # nominal points. Adjust (arm GS, vehicle on its start mark) writes a
    # common x / y / yaw shift into all four; CHECK THEM AGAINST THE LAB.
    # Yaw sequence CLOCKWISE, flown as typed: pick at the payload's yaw (0,
    # pick_place_align_yaw), round to -180 for the place, on to -360 to land
    # (+180 / +360 would turn the other way).
    pick_place_start: [0.0, 0.0, 1.0, 0.0]
    # PICK-AND-DROP ROUTE (2026-10-14, user design): the clockwise loop of the
    # pick-and-place, NOT a straight move back -- start (0, 0) -> pick NE (1, 1)
    # -> PLACE START in the FRONT-RIGHT area (0.8, -1), ~2 m from both pillars
    # (user: x 1.0 -> 0.8) -> the bin at (-1, -1), approached from the east
    # facing it (yaw -180, the user's drop heading) -> withdraw back from the bin
    # -> Land Start / Land at (-0.5, 0.8) (user, 2026-10-14: land further away).
    # ALTITUDES: pick ~1.07 m body -> exit_pick climbs to ~1.27 -> Place Start at
    # 1.0 (user, 2026-10-15; it was a LOW 0.70 for the 172 mm box) -> Ready To
    # Place flies straight to the drop (Drop point + Drop Margin, body ~1.31 m over
    # the 35 mm tray), the arm sweeping on the way, like the set-down's Ready To
    # Place (user, 2026-10-15: no early-climb transition) -> Place opens the
    # gripper -> Exit To Place starts by itself (the arm GS) from where the drone
    # is, backs out the Side Margin (+x, away from the bin) and climbs the
    # Vertical Margin, and HOLDS there (user, 2026-10-15: out of the bin's
    # downwash) -> Go To Land Start folds the arm, the GS closes the gripper ->
    # Land 0.35 (11.5 cm above touchdown on the T650
    # gear, body rests ~0.235 m; 4.5 cm on the sim's X650 gear, 0.305 m --
    # pick_place_fence_min_z below lets it). At Place Start the carried basket's
    # bottom is ~0.44 m above the floor.
    pick_place_place_start: [0.8, -1.0, 1.0, -180.0]
    pick_place_land_start: [-0.5, 0.8, 1.0, -360.0]
    pick_place_land: [-0.5, 0.8, 0.35, -360.0]
    # the geofence FLOOR on the body origin, every leg: 0.30 m so Land can be
    # 0.35 (node default 0.6 -- only the land leg goes below it)
    pick_place_fence_min_z: 0.30
    pick_place_align_yaw: true
    # Arm poses [deg, q1..q4] -- THE BOX PAYLOAD (2026-10-07, user's CAD: a basket
    # with a wire HANGER on top; the claw takes the vertical stem with one finger
    # on each side, both UNDER the arch, and the lift hangs the arch on them).
    # The fingers must pass under the arch, so the claw is near HORIZONTAL
    # (beta = q2 + q3 ~ 70-75). Inside the real arm's q2 range -20..+45 (U2D2
    # board) and q3's +50 stop. Sized on the measured excursions, not the
    # nominal pose: the SET-DOWN (the basket's weight leaving the claw) springs
    # the arm UP by +5..+8 deg on q2 and q3, the LIFT dips q2 by -10..-12.
    # PICK / PLACE [0, 32, 38, 0]: beta 70, the claw 20 deg below horizontal;
    #   flown 3/3 (hook3/5/6, Isaac): q2 peaked 38.9-40.1 at the set-down, q3
    #   44.2-45.5 -> 5-6 deg to +45 / +50; q2 never below 20 (40 deg off -20).
    # CARRY UNTIL 2026-10-16: [12, 38, 42, 0] (2026-10-07, user: a pose clearly
    #   different from the pick pose, to SHOWCASE the arm moving with the payload):
    #   the arm yaws 12 deg and folds up 10 deg -- the hung basket lifts 37 mm and
    #   swings 53 mm sideways (65 mm). The yaw is capped by the landing gear: the
    #   hung basket clears the skids by 29 mm at rest here, by ~1 cm at 15 deg.
    #   beta 80 (claw 10 deg down: flatter than the pick pose, so the hook needs
    #   LESS friction while carrying); 7 / 8 deg to the q2 / q3 stops before the
    #   +2..+3 deg measured in carry. (q1 does not change sigma_nd.)
    #   FLOWN 2/2 (hook9/10, Isaac): the hung basket moved 63 / 69 mm (body
    #   frame) between the carry and place poses, vs 20-25 mm with the old
    #   [0, 35, 40, 0]; skids >= 32 mm; carry-leg peaks q2 39.3, q3 44.5;
    #   placed 53 / 28 mm off axis (the 53 = a deeper hook at the PICK).
    # sigma_nd >= 0.31 everywhere flown (keep-out 0.10, the law's 0.87); J2 / J3
    # hold ~1.2 / 0.6 N.m with the 200 g basket hung.
    # FRICTION IS A REQUIREMENT, NOT A POSE CHOICE: the arch rests on the fingers'
    # top edges, which slope down toward the tips by the claw tilt + ~6 deg of
    # taper (~26 deg at the pick pose, ~21 at beta 75). Isaac at the scene's
    # mu 1.2: 3/3 placed (hook3 knocked off only before the hook-place fix);
    # at mu 0.4 the arch slid off the fingers at the lift with BOTH beta 70
    # and beta 75 (hook7/8). On hardware give the finger tops mu >~ 0.6
    # (rubber / grip tape) or a notch on the arch.
    # Record: Pegasus docs/docs_aerial_manipulator/archive/pick_place_box_payload_20261007/.
    pick_place_pick_pose_deg: [0.0, 32.0, 38.0, 0.0]
    pick_place_place_pose_deg: [0.0, 32.0, 38.0, 0.0]
    # CARRY = THE PICK / DROP POSE SINCE 2026-10-16 (user decision after the 10-15 pick-and-drop
    #   flights, Pegasus archive/wb_pick_drop_flight_20261015): the arm is held FIXED from the
    #   pick to the drop. With the basket hung, the old carry pose's 12 deg arm yaw and loaded
    #   fold-up (j3 at its 1.42 N.m cap for 3.7 s, needing 1.74) came just before the wrist roll
    #   q4 broke loose and swung +-18 deg at 0.5 Hz, rocking the vehicle +-3-4 deg into the drop.
    #   The no-payload run flew the same arm motion with 0.1-0.3 deg, so the motion is harmless
    #   unloaded; with the load it only adds kicks to an undamped wrist. The SET-DOWN profiles
    #   (*_pick_and_place.yaml) keep [12, 38, 42, 0] by override, as flown 10-08..10-10.
    pick_place_carry_pose_deg: [0.0, 32.0, 38.0, 0.0]
    # No arm sweep on the way to the place (three poses only): lo == hi.
    pick_place_sweep_lo_deg: [0.0, 32.0, 38.0, 0.0]
    pick_place_sweep_hi_deg: [0.0, 32.0, 38.0, 0.0]
    pick_place_sweep_phase_deg: [0.0, 90.0, 270.0, 0.0]
    # EE offset [m]: basket centre (obj_0) -> the claw point, ONE for pick and
    # place, in the object's frame (+x = the hanger plane's normal, the claw's
    # approach direction; +z up). THE BOX PAYLOAD: the stem is at x = -27.5 mm,
    # the arch's underside 199 mm above the basket centre; the claw point goes
    # 7.5 mm BEYOND the stem (the stem 8 mm deep between the 30 mm-tall
    # fingers, 24 mm short of their tips) and 0.16 m up, where the open
    # fingers' tops pass 21 mm under the arch and 10 mm under its curving arms.
    # The lift then raises the claw 21 mm before the arch settles on the
    # closed fingers. TUNE ON THE REAL PAYLOAD -- the arm GS's EE Offset row
    # writes it live.
    pick_place_ee_offset: [-0.02, 0.0, 0.16]
    # PLACE pose [x, y, z, yaw_deg] = where the payload's centre is RELEASED, in
    # obj_0's frame. Since 2026-10-14 (user design) the payload is DROPPED into a
    # plastic box (37.1 x 29 cm; walls CUT 17.2 -> 3.5 cm, 2026-10-15) standing on the place hat, TURNED 90 deg
    # (user, 2026-10-14) so its length runs along y (pick_place_place_drop below). THE WORKFLOW (user,
    # 2026-10-15): put the box's COVER on, set the basket on the cover, press the
    # Drop row's Get (x, y, z -- no hand correction), type the yaw, remove the
    # cover. The gripper opens pick_place_drop_height (the arm GS's Drop
    # Margin) above this point. Adjust never moves it. Default: the lab's 0.77 m
    # pillar + 8 mm hat + 35 mm tray = rim 0.813 m, + 32.5 mm half basket =
    # 0.8455 m (cover thickness 0; no cover on the cut tray: anything flat laid
    # across the rim). YAW -180 (user, 2026-10-14: the drop heading) puts the
    # payload's 306 mm (its two side mocap balls) along world y = the turned box's
    # 371 mm length (~366 inside), its 227 mm across the 290 mm width (~285 inside).
    pick_place_place_point: [-1.0, -1.0, 0.8455, -180.0]
    # Safety Margin: Ready To Pick / Place hover this far above the EE target,
    # Exit To Pick / Place climb back to it. Pick / Place descend on request.
    pick_place_approach_dz: 0.20
    pick_place_descent_on_request: true
    # Exit To Pick / Place duration: 0 = the leg bounds (3.2 s for the 0.20 m
    # climb). THE BOX PAYLOAD (2026-10-07): the hook is not a clamp, so nothing
    # pins the vehicle to the pillar and the lift should be GENTLE -- at 1.6 s
    # the arch engaged at ~0.15 m/s, the basket swung to 21 deg and q2 dipped
    # 13.6 deg (hook1). 1.6 s was for the clamped handle plate
    # (PEGASUS_PNP_PAYLOAD=plate): a 3.2 s climb left that box on the cap
    # ~0.9 s and the decoupled rig, pinned to it, tipped over (2026-10-03).
    pick_place_exit_time_s: 0.0
    # Descent trim cap: the decoupled law parks its claw ~5 cm off (up to
    # 74 mm at the place); the trim cancels it. The 50 mm residual gate after
    # the trim is unchanged; the whole-body law trims 1-7 mm.
    pick_place_descent_trim_max: 0.15
    # TRIM FIRST: a trim over 5 mm is flown sideways at the hover height, held
    # 2 s, then the claw descends STRAIGHT down. Flown inside the descent, the
    # decoupled law's ~5 cm trim overshot ~10 mm at the bottom -- beyond the
    # open fingertips' 8.75 mm clearance of the handle (2026-10-03, geo_22).
    pick_place_descent_trim_settle_s: 2.0
    # Safety guard: ABORT's response once the tilt stays above 15 deg for 0.1 s.
    pick_place_guard_tilt_deg: 15.0
    pick_place_guard_persist_s: 0.10
    # ABORT, two-step arm (2026-10-09, user design): the gripper opens, the arm
    # goes to this RELEASE pose while the vehicle climbs (claws 60 deg down: an
    # arch still hanging on the open fingers slides off), holds it, then folds
    # home; the arm GS closes the gripper when the abort completes.
    pick_place_abort_release_pose_deg: [0.0, 0.0, 30.0, 0.0]
    pick_place_abort_release_hold_s: 2.0
    # World-held claw for the pick hover / descent / grasp only (the whole-body
    # node's set_ee_anchor_com; the decoupled node has none, so it is a no-op).
    # The box payload's hook grasp keeps the CoM anchor for the pick too: the
    # fingers have ~17 mm to spare around the stem, and the world-held claw
    # swings q2 by up to 12 deg (2026-10-06 screen) -- past the real arm's +45.
    pick_place_world_anchor_pick: false
    pick_place_world_anchor_place: false
    # HOOK GRASP (the box payload, 2026-10-07): the pick comes in level from
    # 0.10 m behind the stem, the place exit backs out 0.10 m before climbing
    # (the fingers must slide out from under the arch, not lift it again).
    pick_place_pick_approach_back: 0.10
    pick_place_place_exit_back: 0.10
    # DROP PLACE (2026-10-14, user design; the payload's holder has NO arch any
    # more, so opening the jaws releases it): Ready To Place flies the claw
    # straight to the DROP POINT -- the place claw target raised by
    # pick_place_drop_height -- and holds there; Place OPENS the gripper (the
    # payload falls into the box); Exit To Place backs off
    # pick_place_place_exit_back and climbs pick_place_approach_dz to a safe
    # point beside and above the box. No descent. THE DROP MARGIN (2026-10-15,
    # user design; the arm GS's Pick & Drop "Drop Margin" box writes it live):
    # the payload's centre is this far above where it stood on the cover (the
    # place point) when the gripper opens, and this alone sets the drop's height.
    # 0.20 m (user, 2026-10-15; 0.10 = the 10-14 flights' release): the basket's
    # bottom ~20 cm above the rim; over the 35 mm tray (rim 0.813 m) the body
    # flies ~1.31 m. In the
    # place pose the claw is 0.256 m ahead of and 0.102 m below the body origin.
    # false = the set-down place.
    pick_place_place_drop: true
    pick_place_drop_height: 0.20
    # THE PRESCRIBED DROP ALTITUDE (2026-10-14: the BASE at 1.35 m) is RETIRED
    # (2026-10-15, user design): 0 = off, the drop margin above sets the
    # height. Place only opens the gripper; Exit To Place backs out and climbs.
    pick_place_drop_altitude: 0.0
    # Ready To Place's altitude change over the whole leg: 1.0 = the straight
    # transition the set-down's Ready To Place flies (user, 2026-10-15: remove
    # the early-climb transition; it was 0.5 -- the climb done in the first half
    # -- for the LOW 0.70 m Place Start). From the 1.0 m Drop Start the diagonal
    # still crosses the tray's wall with the basket ~15 cm above the rim.
    pick_place_drop_climb_lead: 1.0
    # THE DROP'S EXIT (2026-10-15, user design, second version): the arm GS
    # starts Exit To Place by itself once the gripper reports open; the planner
    # starts it FROM WHERE THE DRONE IS (releasing the payload throws it ~0.14 m
    # back, and an exit from the hold pulled it back over the bin), backs out
    # pick_place_drop_exit_back (the arm GS's Back Margin, +x at the drop's
    # -180; since 2026-10-15 the drop's own, the Side Margin is the hook's)
    # and climbs pick_place_approach_dz (the Vertical Margin), then HOLDS there
    # -- out of the bin's downwash. Go To Land Start then flies to Land Start.
    # true = fly on to Land Start in the exit (the version flown in tray3, not
    # used). (pick_place_drop_exit_offset, the 10-14 hover point: not used.)
    pick_place_drop_exit_to_land_start: false
    pick_place_drop_exit_climb: 0.10
    pick_place_drop_exit_back: 0.20
    # THE AUTONOMOUS DROP (2026-10-16, user design after the 10-15 hardware drops: the Drop
    #   click came 0.67 s after the leg ended, the claw 46-48 mm off and still ringing, the
    #   basket swinging +-40 mm across the claw; Pegasus archive/wb_pick_drop_flight_20261015).
    #   The planner releases BY ITSELF (pick_place/drop_now -> the arm GS's Pick & Drop tab
    #   opens the gripper, as its Drop button does; the button stays the manual override) once,
    #   for dwell_s, ALL hold: >= wait_s since Ready To Drop ended; the claw within claw_tol of
    #   its drop target and slower than claw_speed; the payload's OWN mocap body (obj_0) fresh,
    #   not frozen, not flipped, within payload_tol of the Drop point (x, y) and slower than
    #   payload_speed; the wrist roll q4 within q4_tol_deg of the place pose's. It never
    #   releases on a timer: the status line names the gate it is waiting on. Needs the planner
    #   AND the arm GS from 2026-10-16. false = the Drop button only.
    pick_place_drop_auto: true
    pick_place_drop_auto_wait_s: 2.0
    pick_place_drop_auto_dwell_s: 0.5
    pick_place_drop_auto_claw_tol: 0.020
    pick_place_drop_auto_claw_speed: 0.03
    pick_place_drop_auto_payload_tol: 0.025
    pick_place_drop_auto_payload_speed: 0.04
    pick_place_drop_auto_q4_tol_deg: 3.0
    # AIM THE DROP AT THE BASKET (2026-10-16, user decision after the 10-15 replay: on D-1 the
    #   basket hung [+3, -17] mm from the claw in the vehicle frame, the ee_offset model says
    #   [+20, 0], so the claw on target put the basket ~24 mm off the drop point). While
    #   HOVERING AT DROP START with the arm at the drop pose, the planner measures obj_0 - claw
    #   (FK) in the vehicle frame over the last window_s, starting settle_s into the hover (the
    #   turn to Drop Start excites the wrist swing); Ready To Drop then shifts the drop rest
    #   so the MEASURED basket lands on the Drop point, and the autonomous drop gates position on
    #   the basket only (the claw keeps its stillness gate). Under min_s of samples or a shift
    #   above max_shift the model is used and Ready To Drop's reply says why. HOVER >= 6 s
    #   (settle_s + window_s; window = two periods of the ~0.5 Hz basket swing) at Drop Start
    #   before Ready To Drop; under 4 s (settle_s + min_s) it is not aimed. Read at Ready To
    #   Drop, live-settable. Needs the planner from 2026-10-16 (this key). false = the model.
    pick_place_drop_aim_payload: true
    pick_place_drop_aim_window_s: 4.0
    pick_place_drop_aim_min_s: 2.0
    pick_place_drop_aim_max_shift: 0.06
    pick_place_drop_aim_settle_s: 2.0
    # pick_place_fence_max_z stays at the node default 1.8 m -- set the lab's
    # ceiling (the sim's pick-and-place profile raises it to 2.2: Isaac has none).

    # --- push-and-pull mode (arm GS "Box Pushing" tab), 2026-10-03 ---------
    # GENERATED by fsc_PegasusSimulator/docs/docs_aerial_manipulator/
    # archive/push_pull_20261003/tools/make_push_pull_yaml.py -- edit there.
    # Scene: application/robotic_arm/07_px4_t650_aerial_manipulator_box_pushing.py
    # -- the HOOBRO BB52UXG01G1 console table (1.000 x 0.150 x 0.800 m) in front
    # of the start, its length along y; THE BOX (since 2026-10-16/17): the user's
    # CAD box Box_Push.usda, 500 g (box + bracket), 240 (along the push) x 160 x
    # 100 mm, centre at (0.675, 0.28) -- its back face 0.10 m from the table's +y
    # end -- with a clamp bracket whose 5 mm thick, 60 mm long FIN stands on its
    # top centre (mocap obj_0 = the box centre + yaw); friction 0.25 / 0.25, from
    # the real box on the real table (1.23 N). (History: 2026-10-06 a 400 g 95 mm
    # box with a 20 x 30 mm post; until 2026-10-05 a 200 g 200 x 100 x 60 mm box
    # with a fin on its +y face, offset [0, 0.155, 0.065], push pose [0, -20, 30, 0].)
    #
    # The grasp point: the box centre + this offset in the box frame. 2026-10-07:
    # the user's CAD box (scene PEGASUS_PUSH_HANDLE=cad, assets/Box_Push.usda),
    # 240 x 160 x 100 mm with a clamp bracket whose 60 x 5 mm FIN tops out 258 mm
    # above the table: the claw point 25 mm under the fin top, 233 mm above the
    # table = 0.183 m above the box centre. (The 2026-10-06 20 x 30 mm post on the
    # 95 mm box: 0.2255.) On the box's centre the push line passes through its
    # friction centre: no yaw lever. The drone faces the box's -y (yaw_from_box
    # -90): the jaws close along the box's x, across the fin's 5 mm.
    push_pull_ee_offset: [0.0, 0.0, 0.183]
    push_pull_yaw_from_box_deg: -90.0
    # The arm in the push: beta = 60 deg, [0, 26, 34, 0] (2026-10-07). The world-
    # held claw makes the arm absorb ALL airframe drift (4-5.5 deg of q2 per cm),
    # so the pose must leave room both ways inside the REAL arm's q2 range
    # [-20, 45] and q3 (0, 50]: the 70 deg [0, 30, 40, 0] of 2026-10-06 pinned q3
    # on its +50 stop / q2 at 45 once the scene authored the real range; 50 deg
    # [0, 26, 24, 0] pushed but q3 touched 1 deg at break-away. At 60 deg the CAD
    # box flew push 1/1 (q2 17..36, q3 26..44) and the 24 s pull 4/4.
    # Tipping mu h / (L / 2) = 0.485 for the 240 mm box at mu 0.25, grasp 0.233 m up.
    # 2026-10-16 (archive/box_pushing_campaign_20261016): the SAME 60 deg fold
    # re-split to [0, 32, 28, 0]. Under the push the loaded arm sits ~3 deg below
    # its q2 / ~4 deg above its q3 and swings +-9..14 deg in antiphase, so at
    # [0, 26, 34, 0] q3 rode its +50 stop (400-600 g: 0.3-6.0 s per push, every
    # 400 g run) while q2 never came within 6 deg of +45. Re-split: q3 peaks
    # 42.3-43.6, q2 38.8-40.9, 0 s within 2 deg of either stop in 3 of 3 (500 g,
    # 0.5 m), slide residual unchanged (0.57 vs 0.58 N). The claw moves 10 mm
    # forward / 9 mm up on the body; the skids stay 22 mm above the box top level,
    # beside it.
    push_pull_push_pose_deg: [0.0, 32.0, 28.0, 0.0]
    # Approach: Go To Start holds the claw 0.12 m BEHIND and 0.15 m ABOVE the
    # grasp; Ready To Push slides it diagonally down-forward onto the fin (the
    # forward-pitched jaws straddle it). The vertical margin is the LANDING GEAR's:
    # approaching at the grasp height the skids clipped the (then 95 mm) box
    # (pl_40 / pl_41 pushed it 45-52 mm) -- the planner's keep-out knows only the
    # table. At the push pose [0, 32, 28, 0] the skids are 22 mm above the 100 mm
    # box top at the grasp and 172 mm at Go To Start, straddling the table and the
    # bracket (0.28 m apart inside). Exit To Push climbs 0.25 m straight up with
    # the jaws open (gear clear of the box top and the fin), then folds the arm
    # home. 2026-10-16 (user): the Vertical Margin 0.10 -> 0.15. 2026-10-21 (user):
    # the exit climb 0.20 -> 0.25 -- at 0.20 the skids ended 68 mm (sim gear) /
    # ~62 mm (the real T650's) above the fin top before the arm folds; ~0.12 m now.
    push_pull_approach_dz: 0.15
    push_pull_approach_back: 0.12
    push_pull_exit_dz: 0.25
    # WHEN the law's contact phase switches -- the GRIPPER is the signal
    # (2026-10-06, user): on at the Push press, which the GS sends on the jaws'
    # stall (the box joins the chain), free when the push completes, before the
    # jaws open. (The planner's default is the 10-04 timing: on at the end of
    # Ready with the jaws still open, off at Exit after they opened; raw release
    # residual 1.7-4.1 N there vs 1.1-1.4 N with the gripper timing.)
    push_pull_contact_at_ready: false
    push_pull_contact_off_at_push_end: true
    # The push: the Push Distance along the nose (-y), after a 1.5 s hold. The
    # box's friction is ~1.23 N (0.25 x 500 g), the same to break it loose as to
    # keep it sliding (a box that sticks and then lets go surged the base 7 cm in
    # pl_5). PUSH ONLY since 2026-10-09 (a pull ends loaded and its release is a
    # jolt; < 0 would pull).
    push_pull_push_distance: 0.50
    # THE PUSH SPEED (2026-10-21, user): the operator types only the Push
    # Distance; its TIME is max(|distance| / this mean speed, the floor) -- the
    # ONE source (push_pull_push_time_s is a turn's only; there is no speed in
    # the planner's code), shown under the arm GS's Push Distance. The min-snap
    # push peaks at ~2.19 x the mean. 21 mm/s = the speed every validated 0.50 m
    # push flew (24 s; 2026-10-07: at 12 s the box's stick-slip lurches grew the
    # tilt to 8 deg), and the 2026-10-21 sweep's choice (240 g, 0.10 m, Isaac,
    # 8 / 13 / 21 / 30 mm/s x 3, archive/box_pushing_speed_20261021): the box
    # stuck least short of 30 mm/s, lowest slide impedance residual, box tilt
    # ~0.1 deg (30 mm/s: 0.3-0.7), 6.3 s clamped for 0.10 m. The floor keeps a
    # short push from accelerating at 7.51 v^2 / d (30 mm/s over 0.10 m = 3.3 s
    # flew clean).
    push_pull_push_mean_speed: 0.021
    push_pull_push_min_time_s: 3.0
    # THE TESTED RANGE (2026-10-21, user): the arm GS shows the push's numbers GREEN
    # inside it and RED outside ("retype the Push Distance"). Display only. Distance
    # 0.10 m = the 10-21 sweep's (12 / 12), 0.50 m = the standard validated push;
    # mean speed 8-30 mm/s = the sweep's range (3 / 3 at each).
    push_pull_push_distance_ok: [0.10, 0.50]
    push_pull_push_speed_ok: [0.008, 0.030]
    push_pull_push_settle_s: 1.5
    push_pull_push_ramp_s: 0.0
    push_pull_exit_time_s: 3.0
    # THE UNLOAD (planner option, 2026-10-07) -- OFF: it does not work. A pull
    # ends with the drone still pulling ~1 N and pressing the box down ~1.5 N,
    # and whatever lets go first (CONTACT off, the jaws, or this re-seat) folds
    # the arm onto q3's +50 stop (4/4 pulls) and the Exit can drag the box back
    # (47 / 2 / 23 / 1 mm). Re-seating the hold on the claw's measured position
    # (the law's e_y, over 1.5 s or 6 s) zeroes the CLAW's spring but the load
    # is stored in the law's translational estimate d_hat_t (static friction
    # makes any stored load self-consistent): during the unload it swung -3 ->
    # +0.9 N along the pull and +0.7 -> -2.7 N vertically, the CoM settled
    # 33 mm toward the box and the arm still folded onto the stop (cad_14, 16).
    # A fix needs the controller, not the planner (push_pull_cad_box_20261007).
    push_pull_unload_time_s: 0.0
    # The claw stays held in the WORLD through the push (2026-10-04): with the
    # CoM anchor a base offset dragged the claw reference against the stuck box
    # and the platform observer pushed through its static friction (pl_1..3).
    push_pull_world_anchor_push: true
    # THE HOVER ABOVE THE HANDLE AND THE READY DESCENT ARE CoM-ANCHORED, the claw
    # WORLD-held only from its arrival on the handle (2026-10-07). World-held in
    # free flight the claw's own vertical loop bobbed -- height error 6-30 mm p-p
    # hovering, 20-57 mm in the descent, the arm swinging 13-25 deg in every run,
    # one flip (cad_18). CoM-anchored all the way it is calm (2-3 deg, 4-8 mm)
    # but follows the base's drift: one run 14 mm off-centre across the 5 mm fin,
    # never gripped (cad_20). World-held from the arrival: 3/3, descent 2-3 deg /
    # 5-6 mm, grips -1.4 / -1.3 / +0.5 mm across (cad_22..24). No descent trim:
    # a trim measured CoM-anchored is the base's wander (cad_20 trimmed 9.3 mm).
    push_pull_world_anchor_ready: false
    push_pull_world_anchor_on_handle: true
    push_pull_descent_trim: false
    # Land: back over the START MARK (2026-10-21, user: no 0.5 m backward offset;
    # it was 0.5 m behind it), yaw -360 = 270 deg CLOCKWISE on from the push
    # heading -90 (the whole mission turns one full circle clockwise). Adjust
    # (vehicle on its start mark) writes the measured x, y shift into both, so the
    # vehicle lands where it took off.
    # 2026-10-21 (user, after the first lab trial): the WHOLE layout moved 0.60 m
    # back (-x) -- start mark (0, 0) -> (-0.60, 0), the table keep-out
    # 1.200..1.350 -> 0.600..0.750 (the scene moves the table, the box and the
    # spawn with it): the table had sat near the field's edge. The start-to-table
    # distance, and so every leg to the box, is unchanged.
    # Land hover 0.30 m (2026-10-21, user; was 0.8): the T650 skids sit 0.2425 m
    # (sim) / 0.248 m (hardware) under the body origin, so ~5 cm above the floor,
    # the arm at home (the claw ~0.24 m up); touch down from there in SAFETY.
    push_pull_land: [-0.6, 0.0, 0.3, -360.0]
    # THE WAY TO LAND START (2026-10-16, user design): Go To Land Start is ONE
    # transition from the exit hold to Land Start -- high (1.3 m), off the
    # table, the heading turning -90 -> -360 on the way -- like Go To Start;
    # the planner checks the whole path against push_pull_table. Land then
    # flies straight down to the land hover. Land Start is typed and moved by
    # Adjust like Land. (Flown first and dropped the same day, user: a leg
    # along -y off the table + a quarter circle, ~48 s, and a continuous loop
    # out past the table, 22 s -- not simple.)
    push_pull_land_start: [-0.6, 0.0, 1.3, -360.0]
    push_pull_start_mark: [-0.6, 0.0, 1.0, 0.0]
    # THE TABLE keep-out [x_min, x_max, y_min, y_max, z_top] (world): the gear
    # (push_pull_gear_depth under the body origin, 0.25 m radius) and every arm point over the
    # top keep 5 cm clearance on every planned path. The reference leg -- the +y end,
    # on the side facing the start -- has its outer corner at the round (0.60, 0.50) m
    # for a ruler (2026-10-21, -0.60 m with the layout; 2026-10-16 to 10-21:
    # 1.200..1.350, corner (1.20, 0.50); before that 1.125..1.275).
    push_pull_table: [0.600, 0.750, -0.5, 0.5, 0.80]
    push_pull_table_clearance: 0.05
    # THE LANDING GEAR (2026-10-06): the T650's -- skids 0.2425 m under the body
    # origin, the scene's AM_T650.usda (the X650 gear of AM_xfwd.usda: 0.313).
    # The table check keeps the gear this far above the table top wherever its
    # footprint (push_pull_gear_radius 0.25) is over it.
    push_pull_gear_depth: 0.248  # HARDWARE: MEASURED: the real T650's mocap pivot reads z 0.245-0.248 m resting on the floor (10-20 bag) (sim asset 0.2425)
    # Isaac has no ceiling (the hardware generator, make_hw_box_pushing_yaml.py,
    # writes the lab's 1.8 m)
    push_pull_fence_max_z: 1.8  # HARDWARE: the lab ceiling (sim 2.2)
    # The fence FLOOR on the body origin, every step (node default 0.6): below the
    # 0.30 m Land hover (the check is strict, so not equal to it) and above the
    # T650's resting body height (0.235 sim / ~0.247 hardware). 2026-10-21.
    push_pull_fence_min_z: 0.25
    # SAFETY GUARDS -> ABORT (contact off, release, climb 0.30 m, arm home):
    # tilt > 15 deg for 0.1 s; the task force the law reads > 5 N for 0.3 s while
    # in contact (~4x the box's friction; the bench's along-arm capacity ~6 N).
    push_pull_guard_tilt_deg: 10.0  # HARDWARE: below the node's instant 15 deg watchdog, so the planner's abort opens the jaws first (sim 15; 51 Isaac pushes <= 6.1 deg)
    push_pull_guard_force_n: 5.0
    # THE BOX GUARDS (2026-10-16, archive/box_pushing_campaign_20261016). The
    # worst cases flown with only the two guards above: a box JAMMED mid-push
    # made the arm buckle -- the base kept flying its push while the clamped
    # claw stopped, q2 ran onto its +45 stop and q3 through 0 into the
    # elbow-singular branch in under a second -- and the force guard tripped
    # only after it, at 16.3 N: the vehicle flipped. A box turned 180 deg (or
    # its mocap body) was pushed off the table's end and fell to the floor. The
    # BOX shows both a second or more earlier:
    #   box_half_length / box_edge_margin: PLAN-TIME -- refuse a push whose box
    #     would end within 3 cm of the table's edge (the 240 mm box: half 0.12;
    #     a centred 0.70 m push is the longest that fits);
    #   box_lag: the box > 40 mm behind (jammed / too heavy) or ahead of
    #     (running away, falling off) its plan -- nominal 0..25 mm behind;
    #   box_tilt_deg: the box tilted > 2 deg (tipping, not sliding) -- nominal
    #     <= 0.7 deg; each for box_persist_s;
    #   box_stale_s: no box sample for 0.5 s -- the two above are blind without it;
    #   q3_min_deg: q3 < 10 deg on the handle -- the buckle itself, whatever
    #     caused it (nominal >= 19 deg).
    # THE ABORT ON THE BOX (2026-10-16): with the claw on the box the abort holds the
    # MEASURED pose (not the reference the push was cut at -- a jammed box leaves the
    # planned claw 40+ mm ahead, and holding it dragged the claw along the fin and
    # wedged it in the open jaw), waits 1.0 s for the jaws (they take 0.75 s), backs
    # 3 cm off against the push, then climbs. Isaac 4b: with the old abort the climbing
    # open claw LIFTED a jammed 1 kg box 58 mm, it dropped off, and the vehicle flipped.
    push_pull_abort_from_measured: true
    push_pull_abort_back: 0.03
    push_pull_abort_release_wait_s: 1.5  # HARDWARE: the jaws open over two WiFi hops (planner -> GS -> arm) + 0.65-0.70 s -- hold before the climb (sim 1.0)
    # THE UNBUCKLE (2026-10-21, the first hardware push; archive/box_abort_unbuckle_20261021):
    # the q3-guard trip held q2 on its +45 limit and q3 at ~2 deg -- the elbow-singular
    # boundary, -6.3 at worst while the jaws opened -- for 9 s until the fold. Once the
    # release wait ends, the retreat brings q2 / q3 back to the push pose's (q1 / q4 kept:
    # they move the claw across the fin); the claw goes 25 mm back and 9 mm up against the
    # base, along the fin, before the climb.
    push_pull_abort_unbuckle: true
    push_pull_box_half_length: 0.12
    push_pull_box_edge_margin: 0.03
    push_pull_guard_box_lag: 0.040
    push_pull_guard_box_tilt_deg: 2.0
    push_pull_guard_box_persist_s: 0.20
    push_pull_guard_box_stale_s: 0.50
    push_pull_guard_q3_min_deg: 10.0
    # THE BOX SAMPLE GATE (2026-10-21, the first hardware push; archive/box_mocap_gate_20261021):
    # obj_0 mis-solved -- a 94-96 deg roll with the origin 61 mm off, or a 180 deg flip -- 80
    # samples in 24 short runs over that flight, 2 of them with the claw on the box, where they
    # reached both box guards and the push monitor. A sample farther than 20 mm / 10 deg from
    # the last good one (the allowance growing with the gap: the drone mocap guard's test) is
    # dropped before Get, the box guards and the monitor read it. Replayed on the 10-21 bags it
    # drops every mis-solve and nothing else; a feed that keeps jumping ages out and aborts
    # through box_stale_s above.
    push_pull_box_gate_jump_m: 0.020
    push_pull_box_gate_jump_deg: 10.0
    # THE RAW-MOCAP GUARD (2026-10-21, archive/mocap_safety_guard_20261021): the
    # estimator's guard health. A confirmed mocap fault aborts into a hover (with
    # the claw on the box; a LOST one in any step), and every step and Plan wait for
    # the mocap. The box-pushing stacks launch the estimator with mocap_guard:=true;
    # with the guard off a planner given this topic refuses every step.
    push_pull_mocap_guard_topic: "state_estimator/mocap_guard"
