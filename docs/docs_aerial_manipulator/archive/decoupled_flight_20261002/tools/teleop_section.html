<figure class="wide">
<div class="ee3d" id="tpts">
  <div class="ee3d-bar">
    <div class="seg tog" role="group" aria-label="Lines shown">
      <button type="button" data-s="ref" aria-pressed="true"><span class="sw dash" style="--c:var(--ink2)"></span>reference (planner teleop stream)</button>
      <button type="button" data-s="meas" aria-pressed="true"><span class="sw" style="--c:var(--violet)"></span><span class="sw" style="--c:var(--aqua);margin-left:-4px"></span>measured</button>
    </div>
    <div class="seg" role="group" aria-label="Position rows">
      <button type="button" data-p="ee" aria-pressed="true">Rows: end-effector</button>
      <button type="button" data-p="b" aria-pressed="false">Rows: airframe</button>
    </div>
    <button type="button" id="tpts-refit" class="plain">Refit y-axes</button>
  </div>
  <div id="tpts-plot" class="eeerr-plot" style="height:760px" aria-label="PS4 teleoperation flight: reference and measured position, and the error"></div>
  <p id="tpts-fallback" hidden>This interactive figure needs the Plotly library, which did not load. Table 11 carries the same result in numbers.</p>
</div>
<script type="application/json" id="tpts-data">__DATA__</script>
<script>
(function(){
  var root=document.getElementById('tpts'), plot=document.getElementById('tpts-plot');
  if(typeof window.Plotly==='undefined'){plot.hidden=true;root.querySelector('.ee3d-bar').hidden=true;document.getElementById('tpts-fallback').hidden=false;return;}
  var D=JSON.parse(document.getElementById('tpts-data').textContent), show={ref:true,meas:true}, pos='ee';
  function tok(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
  function build(){
    var c={ink:tok('--ink'),ink2:tok('--ink2'),line:tok('--line'),violet:tok('--violet'),aqua:tok('--aqua')};
    var who=pos==='ee'?'EE':'airframe', mc=pos==='ee'?c.violet:c.aqua;
    var ROWS=[['x',who+' x [m]'],['y',who+' y [m]'],['z',who+' z [m]'],['err',who+' error ‖·‖ [mm]']];
    var gy=0.05, h=(1-3*gy)/4, data=[], L={margin:{l:70,r:12,t:10,b:44},paper_bgcolor:'rgba(0,0,0,0)',plot_bgcolor:'rgba(0,0,0,0)',
      font:{family:"'IBM Plex Sans',system-ui,sans-serif",color:c.ink,size:11},showlegend:false,hovermode:'x unified',
      hoverlabel:{bgcolor:tok('--panel'),bordercolor:c.line,font:{color:c.ink}}};
    ROWS.forEach(function(R,r){
      var i=r+1, xa='xaxis'+(i===1?'':i), ya='yaxis'+(i===1?'':i), xr='x'+(i===1?'':i), yr='y'+(i===1?'':i), y1=1-r*(h+gy);
      L[xa]={domain:[0,1],anchor:yr,showgrid:true,gridcolor:c.line,zeroline:false,color:c.ink2,tickfont:{size:10},showticklabels:r===3,
             title:r===3?{text:'time since teleoperation started [s]',font:{size:11,color:c.ink2}}:undefined};
      if(r>0) L[xa].matches='x';
      L[ya]={domain:[y1-h,y1],anchor:xr,autorange:true,showgrid:true,gridcolor:c.line,zeroline:R[0]==='err',zerolinecolor:c.ink2,zerolinewidth:0.8,
             color:c.ink2,tickfont:{size:10},title:{text:R[1],font:{size:11,color:c.ink2}}};
      var p=pos==='ee'?'ee':'b';
      if(R[0]==='err'){
        data.push({meta:'meas',type:'scatter',mode:'lines',x:D.t,y:D[p+'_err'],xaxis:xr,yaxis:yr,name:'error',visible:show.meas,
          line:{color:mc,width:1.6},hovertemplate:'%{y:.1f} mm'});
      } else {
        data.push({meta:'ref',type:'scatter',mode:'lines',x:D.t,y:D[p+'_ref_'+R[0]],xaxis:xr,yaxis:yr,name:'reference',visible:show.ref,
          line:{color:c.ink2,width:1.4,dash:'dash'},hovertemplate:'%{y:.3f} m'});
        data.push({meta:'meas',type:'scatter',mode:'lines',x:D.t,y:D[p+'_'+R[0]],xaxis:xr,yaxis:yr,name:'measured',visible:show.meas,
          line:{color:mc,width:1.6},hovertemplate:'%{y:.3f} m'});
      }
    });
    Plotly.react(plot,data,L,{displaylogo:false,responsive:true,displayModeBar:false});
  }
  function refit(){var u={};Object.keys(plot.layout).forEach(function(k){if(/^yaxis\d*$/.test(k))u[k+'.autorange']=true;});Plotly.relayout(plot,u);}
  root.querySelectorAll('button[data-s]').forEach(function(b){b.addEventListener('click',function(){
    var s=b.dataset.s; show[s]=!show[s]; b.setAttribute('aria-pressed',String(show[s]));
    var idx=[]; plot.data.forEach(function(t,i){if(t.meta===s)idx.push(i);}); Plotly.restyle(plot,{visible:show[s]},idx).then(refit);
  });});
  root.querySelectorAll('button[data-p]').forEach(function(b){b.addEventListener('click',function(){
    pos=b.dataset.p; root.querySelectorAll('button[data-p]').forEach(function(x){x.setAttribute('aria-pressed',String(x.dataset.p===pos));}); build();
  });});
  document.getElementById('tpts-refit').addEventListener('click',refit);
  build();
})();
</script>
<figcaption>Fig. 6 — The PS4 teleoperation flight of 10-02: world position of the end-effector (violet) or the airframe (aqua) against the reference the planner built from the pad (grey dashed), and the error norm, 25 Hz bin means. The airframe was driven 14 × 19 cm in the horizontal plane and the gripper 7 cm down; altitude and heading were not commanded. Buttons switch the reference or measured lines and the end-effector / airframe rows; drag to zoom, double-click to return.</figcaption></figure>
