# Machine-specific paths
PX4_DIR="$HOME/PX4-Autopilot"
FSC_PEGASUS_ROOT="/home/fsc-jupiter/Source/fsc_PegasusSimulator"
ISAAC_PY="/home/fsc-jupiter/isaacsim/isaac-sim-standalone-5.1.0-linux-x86_64/python_r_fsc.sh"

# External ROS 2 workspace holding the autopilot stack (fsc_autopilot_ros2) and
# the X650 test nodes. Note this machine keeps it under ~/Workspaces, NOT the
# ~/ros2_ws that shiqi_machine uses, and NOT the ~/source/fsc_autopilot_ws that
# the X650 test launchers default to — so it must be set explicitly here.
FSC_AUTOPILOT_WS="$HOME/Workspaces/fsc_autopilot_ws"
# px4_msgs IS built inside that same workspace on this machine (unlike
# shiqi_machine, where it lives in a separate isaacsim workspace).
PX4_MSGS_SETUP="$HOME/Workspaces/fsc_autopilot_ws/install/setup.bash"

# Colcon workspace holding fsc_open_manipulator (OM-X arm position-mode stack
# + arm ground station), used by
# start_t650_aerial_manipulator_geometric_direct_actuation_sitl.sh. Same
# layout as shiqi_machine's ~/colcon_ws — the single arm repo cloned at
# $FSC_OM_ARM_WS/src/fsc_open_manipulator with its pinned Dynamixel deps beside
# it (vcs import) — but placed under ~/Source/Shiqi so it does not collide with
# this machine's pre-existing ~/colcon_ws, which holds the UPSTREAM
# ROBOTIS-GIT/open_manipulator checkout (a different repo: no
# open_manipulator_x_custom_controller, no _isaac_bridge, no custom_gui).
FSC_OM_ARM_WS="$HOME/Source/Shiqi/fsc_om_ws"
# This machine HAS ros2_control installed system-wide from apt, so the
# root-less deb-extract overlay shiqi_machine needs does not apply here.
# /dev/null is the documented "no overlay" value (the launcher's `-f` test
# fails on a character device, so nothing is sourced).
FSC_OM_ARM_ROSDEPS_SETUP="/dev/null"

# Isaac Sim + PX4 real-time factor on this machine (plant seconds per wall
# second). The whole-body law and planner run on the WALL clock, so a yaml that
# sets sim_wall_clock_compensation: true (the 4-D MIRROR does) has its plant
# lags rescaled by this number in scripts/indoor_sim/lib/am_plant_from_yaml.sh.
# PEGASUS_SIM_RTF overrides it per launch.
# Re-measured 2026-10-02 (i5-10600K, 6 cores / 12 threads, NOT hybrid -> no ISAAC_CPUS):
# 05_px4_single_drone_t650.py headless ran at RTF 0.955 (4.18 ms per 4 ms step) until
# Pegasus vehicle.py stopped converting carb.Float3 through np.array() (~0.3 ms/step);
# since then the pacer holds 1.000 in every 10 s window, on the ground and in a CCM
# flight, sleeping ~2 % of the time. Earlier value: 0.34 (2026-09-11, before 06's lazy
# arm dynamics). The pacer exists in 05 (T650 launchers) and 06_..._free_flight only;
# other apps (e.g. 06_..._arm_torque) run unpaced at whatever this box manages.
SIM_REALTIME=1
SIM_RTF=1.0
