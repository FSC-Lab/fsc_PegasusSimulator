# longhao_machine for the X650 slung-load rig (2026-11-21; scripts/indoor_sim/start_x650_slung_load_sitl.sh):
# * PX4_DIR: a PX4 v1.16.0 SITL with the two uxrce_dds_client commits UXRCE_DDS_SC_HZ / UXRCE_DDS_VA_HZ
#   (fscjupiter ~/PX4-Autopilot-v1.16.0-dds-hz 43aacce606 + 2fe7066c2a, = the lab firmware's rate parameters),
#   so sensor_combined / vehicle_attitude reach ROS at the lab rate instead of the stock 10 ms interval;
# * FSC_PEGASUS_ROOT: the checkout Isaac loads the extensions from, with the separately distributed assets
#   (x650_new.usd is not tracked). The slung app itself is taken from the launcher's own checkout.
# Every other rig keeps longhao_machine (stock ~/PX4-Autopilot).
PX4_DIR="$HOME/PX4-Autopilot-dds-hz"
FSC_PEGASUS_ROOT="/home/longhao/source/fsc_PegasusSimulator"
ISAAC_PY="$HOME/isaacsim/python_r_fsc.sh"
