# Machine-specific paths
PX4_DIR="$HOME/PX4-Autopilot"
FSC_PEGASUS_ROOT="/home/shiqi/fsc_PegasusSimulator"
ISAAC_PY="/home/shiqi/isaacsim/python_r_fsc.sh"

# External ROS 2 workspace holding the X650 test/autopilot nodes (apl20,
# x650_direct_actuator_test_node.py). Used by the X650 launch scripts.
FSC_AUTOPILOT_WS="$HOME/ros2_ws"
# px4_msgs is built in the isaacsim workspace, NOT in ros2_ws, so point the
# PX4 ROS 2 overlay there explicitly (the default $FSC_AUTOPILOT_WS/install
# exists but lacks px4_msgs, which would silently break `import px4_msgs`).
PX4_MSGS_SETUP="$HOME/workspaces/isaacsim/install/setup.bash"

# Colcon workspace holding fsc_open_manipulator (OM-X arm position- and
# torque-mode stack + arm ground station), used by the
# start_t650_aerial_manipulator_* launchers. Since the 2026-08-13 repo
# consolidation this is a REGULAR workspace: the single arm repo is cloned at
# $FSC_OM_ARM_WS/src/fsc_open_manipulator with its pinned Dynamixel deps beside
# it (vcs import), and the install tree is $FSC_OM_ARM_WS/install. Since
# 2026-08-23 that workspace is ~/ros2_ws (the same one as FSC_AUTOPILOT_WS,
# which the arm repo's own docs now name); the old ~/colcon_ws is gone, so the
# launchers' $HOME/colcon_ws fallback default no longer resolves here.
FSC_OM_ARM_WS="$HOME/ros2_ws"
# This machine has no system ros2_control/pinocchio and no sudo: the needed
# debs are extracted root-lessly under ~/ros2_ws/rosdeps (see that file's
# header for how to replace it with a real `sudo apt install` later). Point
# at /dev/null on a machine where ros2_control is properly installed.
FSC_OM_ARM_ROSDEPS_SETUP="$HOME/ros2_ws/rosdeps/local_setup.bash"

# Isaac Sim + PX4 real-time factor on this machine (plant seconds per wall
# second). The whole-body law and planner run on the WALL clock, so a yaml that
# sets sim_wall_clock_compensation: true (the 4-D MIRROR does) has its plant
# lags rescaled by this number in scripts/indoor_sim/lib/am_plant_from_yaml.sh.
# PEGASUS_SIM_RTF overrides it per launch. measured 0.477-0.492 on 2026-09-26 (sensor_combined stamps vs wall, GUI and headless).
# 2026-10-01: 1.0. Two fixes made this machine real-time -- 06 no longer evaluates the full
# arm dynamics every physics step (3 of its 4 ms callback, used only by the SAFETY arm hold),
# and Isaac is pinned to the P-cores (ISAAC_CPUS below) -- and the real-time pacer
# (SIM_REALTIME=1 below) holds simulated time to the wall clock, so the plant lags need no
# rescale. Measured with the pacer: headless 1.000 in every 10 s window of a flight (~19 %
# idle), windowed 0.95-1.00 (4 ms physics steps, a frame every 8). The pacer prints the
# achieved RTF every 10 s in the Isaac pane: if it reads well below 1, set this to that.
# SIM_RTF and SIM_REALTIME go together: SIM_RTF=1.0 with the pacer OFF is wrong (headless
# then runs ~1.2x faster than real time).
SIM_RTF=1.0
SIM_REALTIME=1

# Isaac CPU pinning (2026-10-01): the i9-14900KF's P-cores are CPUs 0-15, the
# E-cores 16-31. Unpinned, the scheduler parks Isaac's main thread on an E-core
# part of the time and RTF falls to ~0.76; pinned (taskset -a -c 0-15) the same
# headless run has ~20 % idle per frame under PEGASUS_REALTIME=1. Read by
# scripts/indoor_sim/lib/start_single_drone_x650.sh; PEGASUS_ISAAC_CPUS overrides,
# PEGASUS_ISAAC_CPUS= (empty) does NOT unpin -- set a full list (0-31) for that.
ISAAC_CPUS=0-15
