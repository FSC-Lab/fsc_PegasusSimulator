# Machine-specific paths
PX4_DIR="$HOME/PX4-Autopilot"
FSC_PEGASUS_ROOT="/home/shiqi/fsc_PegasusSimulator"
ISAAC_PY="/home/shiqi/isaacsim/python_r_fsc.sh"

# External ROS 2 workspace holding the X650 test/autopilot nodes (apl20,
# x650_direct_actuator_test_node.py). Used by the X650 launch scripts.
FSC_AUTOPILOT_WS="$HOME/ros2_ws"
# px4_msgs is built in the isaacsim workspace, NOT in ros2_ws, so point the
# PX4 ROS 2 overlay there explicitly (the default $FSC_AUTOPILOT_WS/install
# exists but lacks px4_msgs, which would silently break `import px4_msgs`).
PX4_MSGS_SETUP="$HOME/workspaces/isaacsim/install/setup.bash"

# Colcon workspace holding fsc_open_manipulator (OM-X arm position-mode stack
# + arm ground station), used by
# start_t650_aerial_manipulator_direct_actuator_ros2_arm_sitl.sh. Since the
# 2026-08-13 repo consolidation this is a REGULAR workspace: the single arm
# repo is cloned at $FSC_OM_ARM_WS/src/fsc_open_manipulator with its pinned
# Dynamixel deps beside it (vcs import), and the install tree is
# $FSC_OM_ARM_WS/install.
FSC_OM_ARM_WS="$HOME/colcon_ws"
# This machine has no system ros2_control/pinocchio and no sudo: the needed
# debs are extracted root-lessly under ~/ros2_ws/rosdeps (see that file's
# header for how to replace it with a real `sudo apt install` later). Point
# at /dev/null on a machine where ros2_control is properly installed.
FSC_OM_ARM_ROSDEPS_SETUP="$HOME/ros2_ws/rosdeps/local_setup.bash"
