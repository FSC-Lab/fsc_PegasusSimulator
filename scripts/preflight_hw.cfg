# The hardware preflight table (piece 5, 2026-09-15): what PX4 must answer before the launcher may
# say READY on an aircraft. `NAME  op  value[,value..]  [optional]  # why`. ops: = != < <= > >= in.
# Every line below is something the HIL stack sets the OTHER way on purpose (restart_hil.sh,
# start_vtol_smc_hil.sh 8-relax) -- so a stack that passes this table is not the sim's.
# The flight lead owns this file; a change to it is a change to the flight-test card.

# --- battery: HIL pins SIM_BAT_MIN_PCT 100 / COM_LOW_BAT_ACT 0 so a 5 min JIT rebuild cannot Land it
COM_LOW_BAT_ACT   in  2,3          # 2 = Return, 3 = Land on low battery (0 = warning only is the sim's)
BAT_LOW_THR       >=  0.15         # 15% low-battery threshold (HIL: 0.05)
SIM_BAT_MIN_PCT   =   -1  optional # a sim-only parameter; present = this is not an aircraft

# --- disarm: HIL keeps a landed, idle vehicle armed for minutes of debugging
COM_DISARM_LAND   >   0            # auto-disarm after landing [s]
COM_DISARM_PRFLT  >   0            # auto-disarm if no takeoff after arming [s]

# --- arming checks: HIL opens the EKF / IMU gates so it can arm through a flaky estimator
COM_ARM_EKF_HGT   <=  1.0
COM_ARM_EKF_VEL   <=  0.5
COM_ARM_EKF_POS   <=  0.5
COM_ARM_EKF_YAW   <=  0.5
COM_ARM_IMU_ACC   <=  0.7
COM_ARM_IMU_GYR   <=  0.25
COM_ARM_MAG_ANG   in  30,45,60     # the magnetometer inconsistency check ON (-1 = off is the sim's)

# --- geofence: HIL disables it to fly 800 m at 20 m/s
GF_ACTION         >=  1            # 1 warn, 2 hold, 3 return, 4 terminate, 5 land
GF_MAX_HOR_DIST   >   0            # a horizontal fence exists ...
GF_MAX_HOR_DIST   <=  1500         # ... and is a test-site number, not "off"
GF_MAX_VER_DIST   >   0
GF_PREDICT        =   1            # act before the breach, not after

# --- link losses: what PX4 does when the companion (offboard) or the RC goes quiet
COM_OF_LOSS_T     <=  1.0          # offboard signal loss timeout [s]
COM_OBL_ACT       in  3,4,5        # offboard loss action: 3 Return, 4 Land, 5 Hold -- NEVER 0-2 (a manual mode on a tiltrotor whose CA geometry is best-effort)
NAV_RCL_ACT       in  2,3          # RC loss: 2 Return, 3 Land
RC_MAP_KILL_SW    >   0            # a kill switch is mapped -- somebody holds it

# --- sensors and circuit breakers
SYS_HAS_NUM_ASPD  =   1            # the pitot is declared (piece 4: the loop runs on airspeed)
CBRK_SUPPLY_CHK   =   0            # no circuit breaker on the power check
CBRK_USB_CHK      =   0
CBRK_AIRSPD_CHK   =   0
